<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Edu ARCADE</title>
<link rel="stylesheet" href="../style.css">
<style>
  .board{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    width:min(380px, 86vw);
    aspect-ratio:1/1;
    margin:0 auto;
    background:#0c0a17;
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px;
  }
  .tile{
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(16px,5vw,26px);
    background:#1a1630;
    color:#a79fd1;
    transition:transform .1s ease;
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="logo" href="../index.html">
    <div class="logo__mark">EA</div>
    <div class="logo__text display">Edu<b>ARCADE</b></div>
  </a>
</header>

<div class="player-wrap">
  <div class="player-top">
    <a class="back" href="../index.html">← 아케이드로 돌아가기</a>
  </div>
  <h1 class="display" style="margin:0 0 4px;">2048</h1>
  <p class="howto" style="margin-bottom:18px;">같은 숫자 타일을 합쳐서 2048을 만들어보세요.</p>

  <div class="stage">
    <div class="stage__hud">
      <div class="stat">점수<b id="score">0</b></div>
      <div class="stat">최고 점수<b id="best">0</b></div>
      <button class="btn btn--ghost" id="restartBtn" style="padding:8px 16px;font-size:12px;">다시 시작</button>
    </div>
    <div class="overlay-msg">
      <div class="board" id="board"></div>
      <div class="msg" id="msg">
        <h3 id="msgTitle">게임 오버</h3>
        <p id="finalScore" style="margin:0;color:#a79fd1;">점수: 0</p>
        <button class="btn btn--coin" id="restartBtn2">다시 하기</button>
      </div>
    </div>
    <p class="howto"><b>조작법</b> — 방향키로 타일을 밀어요. 모바일은 스와이프하세요.</p>
  </div>
</div>

<script>
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');
const msgTitle = document.getElementById('msgTitle');
const finalScoreEl = document.getElementById('finalScore');

const colors = {
  2:'#2b2450', 4:'#3a2f6b', 8:'#8b6bff', 16:'#ff9f4d',
  32:'#ff7a4d', 64:'#ff4d7d', 128:'#ffcb3d', 256:'#ffd75e',
  512:'#35e0c8', 1024:'#35c8e0', 2048:'#ff4d7d'
};

let grid, score, best, over, won;
best = Number(localStorage.getItem('coinArcade2048Best') || 0);
bestEl.textContent = best;

function reset(){
  grid = Array.from({length:4}, ()=>Array(4).fill(0));
  score = 0; over = false; won = false;
  scoreEl.textContent = score;
  msgEl.classList.remove('show');
  addTile(); addTile();
  render();
}

function addTile(){
  const empties = [];
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(grid[r][c]===0) empties.push([r,c]);
  if(empties.length===0) return;
  const [r,c] = empties[Math.floor(Math.random()*empties.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render(){
  boardEl.innerHTML = '';
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const v = grid[r][c];
      const div = document.createElement('div');
      div.className = 'tile';
      if(v){
        div.textContent = v;
        div.style.background = colors[v] || '#ff4d7d';
        div.style.color = v <= 4 ? '#f4f1ff' : (v>=128 && v<=256 ? '#1a1102' : '#fff');
      }
      boardEl.appendChild(div);
    }
  }
}

function slideRowLeft(row){
  let arr = row.filter(v=>v!==0);
  let moved = false;
  for(let i=0;i<arr.length-1;i++){
    if(arr[i] === arr[i+1]){
      arr[i] *= 2;
      score += arr[i];
      if(arr[i] === 2048) won = true;
      arr.splice(i+1,1);
    }
  }
  while(arr.length < 4) arr.push(0);
  for(let i=0;i<4;i++) if(arr[i] !== row[i]) moved = true;
  return { arr, moved };
}

function rotateGrid(g){
  const n = g.map((row,r)=>row.map((_,c)=>g[3-c][r]));
  return n;
}

function move(direction){
  if(over) return;
  let g = grid;
  let rotations = { left:0, up:1, right:2, down:3 }[direction];
  for(let i=0;i<rotations;i++) g = rotateGrid(g);

  let anyMoved = false;
  g = g.map(row=>{
    const { arr, moved } = slideRowLeft(row);
    if(moved) anyMoved = true;
    return arr;
  });

  for(let i=0;i<(4-rotations)%4;i++) g = rotateGrid(g);

  if(anyMoved){
    grid = g;
    addTile();
    scoreEl.textContent = score;
    if(score > best){
      best = score;
      localStorage.setItem('coinArcade2048Best', best);
      bestEl.textContent = best;
    }
    render();
    if(won){
      over = true;
      msgTitle.textContent = '2048 달성! 🎉';
      finalScoreEl.textContent = '점수: ' + score;
      msgEl.classList.add('show');
      return;
    }
    if(!canMove()){
      over = true;
      msgTitle.textContent = '게임 오버';
      finalScoreEl.textContent = '점수: ' + score;
      msgEl.classList.add('show');
    }
  }
}

function canMove(){
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      if(grid[r][c] === 0) return true;
      if(c<3 && grid[r][c] === grid[r][c+1]) return true;
      if(r<3 && grid[r][c] === grid[r+1][c]) return true;
    }
  }
  return false;
}

const keyMap = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
window.addEventListener('keydown', e=>{
  const d = keyMap[e.key];
  if(!d) return;
  e.preventDefault();
  move(d);
});

let touchStart = null;
boardEl.addEventListener('touchstart', e=>{ touchStart = e.touches[0]; }, {passive:true});
boardEl.addEventListener('touchend', e=>{
  if(!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.clientX;
  const dy = e.changedTouches[0].clientY - touchStart.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy)) < 20) return;
  if(Math.abs(dx) > Math.abs(dy)){
    move(dx>0 ? 'right' : 'left');
  } else {
    move(dy>0 ? 'down' : 'up');
  }
  touchStart = null;
});

document.getElementById('restartBtn').addEventListener('click', reset);
document.getElementById('restartBtn2').addEventListener('click', reset);

reset();
</script>

</body>
</html>

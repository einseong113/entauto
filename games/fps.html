<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D FPS 게임</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; overscroll-behavior: none; touch-action: none; }
  canvas { display: block; touch-action: none; }

  #crosshair {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 20px; height: 20px;
    pointer-events: none; z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #00ff88;
    box-shadow: 0 0 4px #00ff88;
  }
  #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
  #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

  #hud {
    position: fixed; top: 16px; left: 16px; color: #fff;
    z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    font-size: 16px; line-height: 1.6;
  }
  #hud span { color: #00ff88; font-weight: bold; }

  #timer {
    position: fixed; top: 16px; right: 16px; color: #fff;
    z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    font-size: 22px; font-weight: bold;
  }

  #hitmarker {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 30px; height: 30px; pointer-events: none; z-index: 11;
    opacity: 0; transition: opacity 0.1s;
  }
  #hitmarker.show { opacity: 1; }
  #hitmarker::before, #hitmarker::after {
    content: ''; position: absolute; background: #ff3333; height: 2px; width: 14px;
  }
  #hitmarker::before { top: 4px; left: 4px; transform: rotate(45deg); }
  #hitmarker::after { top: 4px; right: 4px; transform: rotate(-45deg); }

  #menu {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 20;
    background: radial-gradient(circle at center, #1a2634 0%, #0a0f16 100%);
    color: #fff; text-align: center;
  }
  #menu h1 { font-size: 48px; margin-bottom: 8px; letter-spacing: 2px; color: #00ff88; text-shadow: 0 0 20px rgba(0,255,136,0.5); }
  #menu p { color: #aaa; max-width: 480px; line-height: 1.6; margin: 8px 0 24px; }
  #startBtn {
    padding: 14px 40px; font-size: 18px; font-weight: bold; letter-spacing: 1px;
    background: #00ff88; color: #06120c; border: none; border-radius: 6px;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  }
  #startBtn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0,255,136,0.6); }

  #gameOver {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 20;
    background: rgba(5, 8, 12, 0.92); color: #fff; text-align: center;
  }
  #gameOver h1 { font-size: 42px; color: #ff3355; margin-bottom: 4px; }
  #gameOver p { font-size: 20px; color: #ddd; margin: 6px 0; }
  #gameOver span { color: #00ff88; font-weight: bold; }
  #restartBtn {
    margin-top: 20px; padding: 12px 32px; font-size: 16px; font-weight: bold;
    background: #00ff88; color: #06120c; border: none; border-radius: 6px; cursor: pointer;
  }

  #controlsHint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: #888; font-size: 13px; z-index: 10; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  /* ---------- 모바일 터치 컨트롤 ---------- */
  #joystickZone {
    position: fixed; left: 0; bottom: 0; width: 45vw; height: 55vh;
    z-index: 15; touch-action: none; display: none;
  }
  #joystickBase {
    position: fixed; width: 110px; height: 110px; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35);
    display: none; z-index: 16; pointer-events: none;
  }
  #joystickKnob {
    position: fixed; width: 50px; height: 50px; border-radius: 50%;
    background: rgba(0,255,136,0.55); border: 2px solid rgba(0,255,136,0.9);
    display: none; z-index: 17; pointer-events: none;
  }
  #lookZone {
    position: fixed; right: 0; bottom: 0; width: 55vw; height: 70vh;
    z-index: 15; touch-action: none; display: none;
  }
  #jumpBtn, #shootBtn {
    position: fixed; z-index: 18; display: none;
    border-radius: 50%; text-align: center; user-select: none;
    -webkit-user-select: none; touch-action: none;
    font-weight: bold; color: #fff;
  }
  #shootBtn {
    right: 24px; bottom: 110px; width: 78px; height: 78px; line-height: 78px;
    background: rgba(255,51,85,0.35); border: 2px solid rgba(255,51,85,0.8);
    font-size: 14px;
  }
  #jumpBtn {
    right: 118px; bottom: 24px; width: 60px; height: 60px; line-height: 60px;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.5);
    font-size: 13px;
  }
  body.mobile #joystickZone,
  body.mobile #lookZone,
  body.mobile #jumpBtn,
  body.mobile #shootBtn { display: block; }
  body.mobile #controlsHint { display: none; }
</style>
</head>
<body>

<div id="menu">
  <h1>⚡ ARENA STRIKE</h1>
  <p>60초 동안 최대한 많은 타겟을 맞춰라! WASD로 이동, 마우스로 시야 조작, 클릭으로 사격, Shift로 달리기, Space로 점프.</p>
  <button id="startBtn">게임 시작</button>
</div>

<div id="gameOver">
  <h1>게임 종료</h1>
  <p>최종 점수: <span id="finalScore">0</span></p>
  <p>명중률: <span id="finalAccuracy">0%</span></p>
  <button id="restartBtn">다시 하기</button>
</div>

<div id="crosshair"></div>
<div id="hitmarker"></div>
<div id="hud">
  점수: <span id="score">0</span><br>
  명중: <span id="hits">0</span> / <span id="shots">0</span>
</div>
<div id="timer">60</div>
<div id="controlsHint">ESC 키로 일시정지 · 클릭하여 재개</div>

<!-- 모바일 터치 컨트롤 -->
<div id="joystickZone"></div>
<div id="joystickBase"></div>
<div id="joystickKnob"></div>
<div id="lookZone"></div>
<div id="jumpBtn">점프</div>
<div id="shootBtn">발사</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ------------------------------------------------------------
// 기본 세팅
// ------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8d9);
scene.fog = new THREE.Fog(0x87b8d9, 20, 90);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.7, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// 조명
const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
scene.add(sun);

// ------------------------------------------------------------
// 바닥 및 아레나
// ------------------------------------------------------------
const groundGeo = new THREE.PlaneGeometry(160, 160);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a5a40 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 그리드 라인 느낌
const grid = new THREE.GridHelper(160, 40, 0x2c4632, 0x2c4632);
grid.position.y = 0.01;
scene.add(grid);

const colliders = []; // { box3, mesh }

function addBox(w, h, d, x, y, z, color) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  const box3 = new THREE.Box3().setFromObject(mesh);
  colliders.push({ box3, mesh });
  return mesh;
}

// 외벽
addBox(160, 6, 1, 0, 3, -80, 0x55606b);
addBox(160, 6, 1, 0, 3, 80, 0x55606b);
addBox(1, 6, 160, -80, 3, 0, 0x55606b);
addBox(1, 6, 160, 80, 3, 0, 0x55606b);

// 엄폐물
const obstacleColors = [0x8a6d3b, 0x6b7a8f, 0x7a4b4b, 0x4b7a5c];
for (let i = 0; i < 14; i++) {
  const w = 3 + Math.random() * 4;
  const h = 2 + Math.random() * 3;
  const d = 3 + Math.random() * 4;
  const x = (Math.random() - 0.5) * 130;
  const z = (Math.random() - 0.5) * 130;
  if (Math.abs(x) < 6 && Math.abs(z) < 6) continue; // 스폰 지점 비움
  addBox(w, h, d, x, h / 2, z, obstacleColors[i % obstacleColors.length]);
}

// ------------------------------------------------------------
// 타겟 (적)
// ------------------------------------------------------------
const targets = [];

function spawnTarget() {
  const geo = new THREE.SphereGeometry(0.6, 16, 16);
  const mat = new THREE.MeshStandardMaterial({ color: 0xff3355, emissive: 0x330000 });
  const mesh = new THREE.Mesh(geo, mat);

  let x, z;
  do {
    x = (Math.random() - 0.5) * 130;
    z = (Math.random() - 0.5) * 130;
  } while (Math.abs(x) < 5 && Math.abs(z) < 5);

  mesh.position.set(x, 1.2 + Math.random() * 2, z);
  mesh.castShadow = true;
  mesh.userData.bobPhase = Math.random() * Math.PI * 2;
  mesh.userData.baseY = mesh.position.y;
  mesh.userData.dir = new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize();
  scene.add(mesh);
  targets.push(mesh);
}

function removeTarget(mesh) {
  scene.remove(mesh);
  const idx = targets.indexOf(mesh);
  if (idx !== -1) targets.splice(idx, 1);
}

for (let i = 0; i < 8; i++) spawnTarget();

// ------------------------------------------------------------
// 총 모델 (1인칭 뷰 모델)
// ------------------------------------------------------------
const gunGroup = new THREE.Group();
const gunBody = new THREE.Mesh(
  new THREE.BoxGeometry(0.15, 0.15, 0.6),
  new THREE.MeshStandardMaterial({ color: 0x222222 })
);
gunBody.position.set(0.25, -0.25, -0.6);
gunGroup.add(gunBody);
const gunTip = new THREE.Mesh(
  new THREE.BoxGeometry(0.08, 0.08, 0.2),
  new THREE.MeshStandardMaterial({ color: 0x111111 })
);
gunTip.position.set(0.25, -0.25, -0.95);
gunGroup.add(gunTip);
camera.add(gunGroup);
scene.add(camera);

// ------------------------------------------------------------
// 포인터 락 + 마우스 조작
// ------------------------------------------------------------
let yaw = 0, pitch = 0;
let pointerLocked = false;

const domElement = renderer.domElement;

function requestLock() {
  domElement.requestPointerLock();
}

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === domElement;
});

document.addEventListener('mousemove', (e) => {
  if (!pointerLocked || !gameRunning) return;
  const sensitivity = 0.0022;
  yaw -= e.movementX * sensitivity;
  pitch -= e.movementY * sensitivity;
  pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
});

// ------------------------------------------------------------
// 이동
// ------------------------------------------------------------
const keys = {};
document.addEventListener('keydown', (e) => { keys[e.code] = true; });
document.addEventListener('keyup', (e) => { keys[e.code] = false; });

const velocity = new THREE.Vector3();
let canJump = true;
const playerHeight = 1.7;
const playerRadius = 0.4;

function collidesAt(x, z) {
  const min = new THREE.Vector3(x - playerRadius, 0, z - playerRadius);
  const max = new THREE.Vector3(x + playerRadius, playerHeight, z + playerRadius);
  const playerBox = new THREE.Box3(min, max);
  for (const c of colliders) {
    if (c.box3.intersectsBox(playerBox)) return true;
  }
  return false;
}

// ------------------------------------------------------------
// 사격 & HUD
// ------------------------------------------------------------
let score = 0, hits = 0, shots = 0;
let gameRunning = false;
let timeLeft = 60;
let timerInterval = null;

const scoreEl = document.getElementById('score');
const hitsEl = document.getElementById('hits');
const shotsEl = document.getElementById('shots');
const timerEl = document.getElementById('timer');
const hitmarker = document.getElementById('hitmarker');

const raycaster = new THREE.Raycaster();

function shoot() {
  if (!gameRunning) return;
  if (!pointerLocked && !isMobile) return;
  shots++;
  shotsEl.textContent = shots;

  // 반동 애니메이션
  gunGroup.position.z += 0.1;
  setTimeout(() => { gunGroup.position.z = 0; }, 80);

  raycaster.setFromCamera({ x: 0, y: 0 }, camera);
  const intersects = raycaster.intersectObjects(targets);
  if (intersects.length > 0) {
    const hitMesh = intersects[0].object;
    hits++;
    score += 10;
    hitsEl.textContent = hits;
    scoreEl.textContent = score;
    hitmarker.classList.add('show');
    setTimeout(() => hitmarker.classList.remove('show'), 100);
    removeTarget(hitMesh);
    spawnTarget();
  }
}

domElement.addEventListener('mousedown', (e) => {
  if (isMobile) return; // 모바일은 별도 버튼으로 사격
  if (e.button === 0) {
    if (!pointerLocked && gameRunning) { requestLock(); return; }
    shoot();
  }
});

// ------------------------------------------------------------
// 모바일 터치 컨트롤
// ------------------------------------------------------------
const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isMobile) {
  document.body.classList.add('mobile');
  document.querySelector('#menu p').textContent =
    '60초 동안 최대한 많은 타겟을 맞춰라! 왼쪽 화면을 드래그해 이동, 오른쪽 화면을 드래그해 시야 조작, 발사 버튼으로 사격, 점프 버튼으로 점프.';
}

const joystickZone = document.getElementById('joystickZone');
const joystickBase = document.getElementById('joystickBase');
const joystickKnob = document.getElementById('joystickKnob');
const lookZone = document.getElementById('lookZone');
const jumpBtn = document.getElementById('jumpBtn');
const shootBtn = document.getElementById('shootBtn');

let joyTouchId = null;
let joyOrigin = { x: 0, y: 0 };
let joyVector = { x: 0, y: 0 }; // -1..1
const JOY_RADIUS = 55;

function joyStart(e) {
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  joyOrigin = { x: t.clientX, y: t.clientY };
  joystickBase.style.left = (t.clientX - 55) + 'px';
  joystickBase.style.top = (t.clientY - 55) + 'px';
  joystickBase.style.display = 'block';
  joystickKnob.style.left = (t.clientX - 25) + 'px';
  joystickKnob.style.top = (t.clientY - 25) + 'px';
  joystickKnob.style.display = 'block';
}
function joyMove(e) {
  for (const t of e.changedTouches) {
    if (t.identifier !== joyTouchId) continue;
    let dx = t.clientX - joyOrigin.x;
    let dy = t.clientY - joyOrigin.y;
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_RADIUS) { dx = dx / dist * JOY_RADIUS; dy = dy / dist * JOY_RADIUS; }
    joystickKnob.style.left = (joyOrigin.x + dx - 25) + 'px';
    joystickKnob.style.top = (joyOrigin.y + dy - 25) + 'px';
    joyVector.x = dx / JOY_RADIUS;
    joyVector.y = dy / JOY_RADIUS;
  }
}
function joyEnd(e) {
  for (const t of e.changedTouches) {
    if (t.identifier !== joyTouchId) continue;
    joyTouchId = null;
    joyVector = { x: 0, y: 0 };
    joystickBase.style.display = 'none';
    joystickKnob.style.display = 'none';
  }
}
joystickZone.addEventListener('touchstart', (e) => { e.preventDefault(); if (joyTouchId === null) joyStart(e); }, { passive: false });
joystickZone.addEventListener('touchmove', (e) => { e.preventDefault(); joyMove(e); }, { passive: false });
joystickZone.addEventListener('touchend', (e) => { e.preventDefault(); joyEnd(e); }, { passive: false });
joystickZone.addEventListener('touchcancel', (e) => { e.preventDefault(); joyEnd(e); }, { passive: false });

// 시야 조작 (드래그)
let lookTouchId = null;
let lastLook = { x: 0, y: 0 };
lookZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (lookTouchId !== null) return;
  const t = e.changedTouches[0];
  lookTouchId = t.identifier;
  lastLook = { x: t.clientX, y: t.clientY };
}, { passive: false });
lookZone.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== lookTouchId) continue;
    const dx = t.clientX - lastLook.x;
    const dy = t.clientY - lastLook.y;
    lastLook = { x: t.clientX, y: t.clientY };
    if (!gameRunning) continue;
    const sensitivity = 0.0032;
    yaw -= dx * sensitivity;
    pitch -= dy * sensitivity;
    pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
  }
}, { passive: false });
lookZone.addEventListener('touchend', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null;
}, { passive: false });
lookZone.addEventListener('touchcancel', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null;
}, { passive: false });

// 점프 버튼
jumpBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameRunning && canJump) { velocity.y = 7; canJump = false; }
}, { passive: false });

// 발사 버튼
shootBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  shoot();
}, { passive: false });

// ------------------------------------------------------------
// 메뉴 / 게임 시작 / 종료
// ------------------------------------------------------------
const menuEl = document.getElementById('menu');
const gameOverEl = document.getElementById('gameOver');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');

function resetGame() {
  score = 0; hits = 0; shots = 0; timeLeft = 60;
  scoreEl.textContent = 0; hitsEl.textContent = 0; shotsEl.textContent = 0; timerEl.textContent = 60;
  camera.position.set(0, playerHeight, 10);
  yaw = 0; pitch = 0;
  velocity.set(0, 0, 0);

  targets.forEach(t => scene.remove(t));
  targets.length = 0;
  for (let i = 0; i < 8; i++) spawnTarget();
}

function startGame() {
  resetGame();
  menuEl.style.display = 'none';
  gameOverEl.style.display = 'none';
  gameRunning = true;
  if (!isMobile) requestLock();

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!gameRunning) return;
    timeLeft--;
    timerEl.textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  gameRunning = false;
  clearInterval(timerInterval);
  document.exitPointerLock();
  document.getElementById('finalScore').textContent = score;
  const acc = shots > 0 ? Math.round((hits / shots) * 100) : 0;
  document.getElementById('finalAccuracy').textContent = acc + '%';
  gameOverEl.style.display = 'flex';
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Escape' && pointerLocked) {
    document.exitPointerLock();
  }
});

// ------------------------------------------------------------
// 애니메이션 루프
// ------------------------------------------------------------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);

  // 카메라 회전 적용
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  if (gameRunning && (pointerLocked || isMobile)) {
    const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 7 : 4.2;
    const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)).multiplyScalar(-1);
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).multiplyScalar(-1);

    let moveX = 0, moveZ = 0;
    if (keys['KeyW']) { moveX += forward.x; moveZ += forward.z; }
    if (keys['KeyS']) { moveX -= forward.x; moveZ -= forward.z; }
    if (keys['KeyA']) { moveX -= right.x; moveZ -= right.z; }
    if (keys['KeyD']) { moveX += right.x; moveZ += right.z; }

    if (isMobile && (joyVector.x !== 0 || joyVector.y !== 0)) {
      // 조이스틱: y가 음수면 전진
      moveX += right.x * joyVector.x - forward.x * joyVector.y;
      moveZ += right.z * joyVector.x - forward.z * joyVector.y;
    }

    const len = Math.hypot(moveX, moveZ);
    if (len > 0) { moveX /= len; moveZ /= len; }

    const nextX = camera.position.x + moveX * speed * delta;
    const nextZ = camera.position.z + moveZ * speed * delta;

    if (!collidesAt(nextX, camera.position.z)) camera.position.x = nextX;
    if (!collidesAt(camera.position.x, nextZ)) camera.position.z = nextZ;

    // 경계 제한
    camera.position.x = Math.max(-78, Math.min(78, camera.position.x));
    camera.position.z = Math.max(-78, Math.min(78, camera.position.z));

    // 점프
    velocity.y -= 20 * delta;
    if (keys['Space'] && canJump) {
      velocity.y = 7;
      canJump = false;
    }
    camera.position.y += velocity.y * delta;
    if (camera.position.y <= playerHeight) {
      camera.position.y = playerHeight;
      velocity.y = 0;
      canJump = true;
    }

    // 총 흔들림(걷기)
    if (len > 0) {
      const t = clock.elapsedTime * 10;
      gunGroup.position.y = -0.02 + Math.sin(t) * 0.015;
    }
  }

  // 타겟 애니메이션 (부유 + 이동)
  targets.forEach(t => {
    t.userData.bobPhase += delta * 2;
    t.position.y = t.userData.baseY + Math.sin(t.userData.bobPhase) * 0.3;
    t.position.x += t.userData.dir.x * delta * 1.2;
    t.position.z += t.userData.dir.z * delta * 1.2;
    if (Math.abs(t.position.x) > 78 || Math.abs(t.position.z) > 78) {
      t.userData.dir.multiplyScalar(-1);
    }
    t.rotation.y += delta * 2;
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>

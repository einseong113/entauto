<!DOCTYPE html>
<html lang="ko">
<head>
    <style>
        /* 주변 여백 제거 및 스크롤바 숨김 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
        }
        /* iframe을 화면 전체 크기로 지정 */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="https://subwaysurferspc.io/subway-surfers.embed"></iframe>
</body>
</html>

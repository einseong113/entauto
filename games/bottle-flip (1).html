<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>물병 세우기 챌린지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0d0720;
    --bg-mid:#1c1040;
    --bg-mid2:#2a1256;
    --neon-cyan:#37f0ff;
    --neon-pink:#ff3d81;
    --neon-lime:#c8ff33;
    --neon-yellow:#ffd23f;
    --ink:#f3eeff;
    --ink-dim:#a89bd4;
    --glass:rgba(255,255,255,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:var(--bg-deep);
    font-family:'Gothic A1', sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
    position:fixed; inset:0;
  }
  .display{ font-family:'Black Han Sans', sans-serif; letter-spacing:0.5px; }

  #stage{
    position:relative; width:100%; height:100%; overflow:hidden;
    background:
      radial-gradient(ellipse 120% 60% at 50% 0%, var(--bg-mid2) 0%, var(--bg-deep) 65%);
  }

  canvas#game{ position:absolute; inset:0; display:block; touch-action:none; }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:18px 20px; pointer-events:none; z-index:5;
  }
  .hud-block{
    background:var(--glass);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;
    padding:8px 14px;
    backdrop-filter:blur(6px);
    box-shadow:0 4px 18px rgba(0,0,0,0.35);
  }
  #scoreBlock .label{ font-size:11px; color:var(--ink-dim); letter-spacing:2px; }
  #scoreBlock .value{ font-family:'Black Han Sans',sans-serif; font-size:30px; line-height:1.05; color:var(--neon-cyan); text-shadow:0 0 14px rgba(55,240,255,0.65); }
  #hearts{ margin-top:4px; font-size:16px; letter-spacing:3px; }

  #rightBlock{ text-align:right; }
  #levelTag{ font-size:11px; color:var(--ink-dim); letter-spacing:2px; }
  #comboWrap{ display:flex; align-items:center; justify-content:flex-end; gap:6px; }
  #comboVal{ font-family:'Black Han Sans',sans-serif; font-size:24px; color:var(--neon-pink); text-shadow:0 0 12px rgba(255,61,129,0.6); }
  #bestVal{ font-size:12px; color:var(--ink-dim); margin-top:2px; }

  /* ---------- power meter ---------- */
  #meterWrap{
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    width:min(420px, 84vw); z-index:5;
  }
  #meterTrack{
    position:relative; width:100%; height:20px;
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,255,255,0.18);
    border-radius:999px; overflow:hidden;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.5);
  }
  #meterFill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:linear-gradient(90deg, var(--neon-cyan), var(--neon-lime), var(--neon-yellow), var(--neon-pink));
    transition:none;
  }
  #meterSweetSpot{
    position:absolute; top:-4px; bottom:-4px; width:10px;
    background:rgba(255,255,255,0.9);
    border-radius:4px;
    box-shadow:0 0 12px rgba(255,255,255,0.9);
    display:none;
  }
  #meterNeedle{
    position:absolute; top:-6px; width:4px; height:32px;
    background:#fff; border-radius:2px; left:0%;
    box-shadow:0 0 8px rgba(255,255,255,0.8);
  }
  #meterHint{
    text-align:center; margin-top:10px; font-size:13px; color:var(--ink-dim); letter-spacing:1px;
    user-select:none;
  }
  #meterHint b{ color:var(--neon-yellow); }

  #tapCatcher{
    position:absolute; inset:0; z-index:4; cursor:pointer;
    touch-action:none;
  }

  /* ---------- floating popups ---------- */
  .popup{
    position:absolute; font-family:'Black Han Sans',sans-serif;
    font-size:26px; color:var(--neon-yellow); text-shadow:0 0 10px rgba(255,210,63,0.8);
    pointer-events:none; z-index:6; transform:translate(-50%,-50%);
    animation:popUp 0.9s ease-out forwards;
    white-space:nowrap;
  }
  @keyframes popUp{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.6); }
    15%{ opacity:1; transform:translate(-50%,-70%) scale(1.15); }
    100%{ opacity:0; transform:translate(-50%,-140%) scale(1); }
  }

  /* ---------- overlays ---------- */
  .overlay{
    position:absolute; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, rgba(42,18,86,0.92), rgba(9,5,20,0.96));
    backdrop-filter:blur(2px);
  }
  .hidden{ display:none !important; }

  .panel{
    width:min(420px, 88vw);
    text-align:center;
    padding:34px 26px 30px;
    border-radius:26px;
    background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 0 60px rgba(55,240,255,0.08);
  }
  .title-main{
    font-family:'Black Han Sans',sans-serif;
    font-size:44px; line-height:1.15;
    background:linear-gradient(90deg,var(--neon-cyan),var(--neon-lime) 40%,var(--neon-yellow) 70%,var(--neon-pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(255,61,129,0.25);
    margin:0 0 6px;
  }
  .subtitle{ color:var(--ink-dim); font-size:14px; margin-bottom:22px; letter-spacing:0.5px;}
  .howto{
    text-align:left; font-size:13.5px; color:var(--ink); line-height:1.75;
    background:rgba(0,0,0,0.22); border-radius:14px; padding:14px 16px; margin-bottom:22px;
    border:1px solid rgba(255,255,255,0.08);
  }
  .howto b{ color:var(--neon-lime); }
  .bigBtn{
    display:inline-block; width:100%;
    font-family:'Black Han Sans',sans-serif; font-size:20px; letter-spacing:1px;
    padding:15px 0; border-radius:16px; border:none; cursor:pointer;
    background:linear-gradient(90deg, var(--neon-cyan), var(--neon-lime));
    color:#0d0720;
    box-shadow:0 8px 0 rgba(0,0,0,0.35), 0 0 30px rgba(55,240,255,0.35);
    transform:translateY(0);
    transition:transform .08s ease;
  }
  .bigBtn:active{ transform:translateY(6px); box-shadow:0 2px 0 rgba(0,0,0,0.35); }

  #gameOverScore{ font-family:'Black Han Sans',sans-serif; font-size:52px; color:var(--neon-pink); text-shadow:0 0 22px rgba(255,61,129,0.6); margin:6px 0 0;}
  #gameOverBest{ font-size:14px; color:var(--ink-dim); margin-bottom:22px; }
  #newBestTag{
    display:inline-block; margin:8px 0 18px; padding:5px 14px; border-radius:999px;
    background:rgba(200,255,51,0.15); border:1px solid var(--neon-lime); color:var(--neon-lime);
    font-size:12px; letter-spacing:1px;
  }

  @media (prefers-reduced-motion: reduce){
    .popup{ animation-duration:0.01s; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="scoreBlock" class="hud-block">
      <div class="label">SCORE</div>
      <div class="value" id="scoreVal">0</div>
      <div id="hearts">❤️❤️❤️</div>
    </div>
    <div id="rightBlock" class="hud-block">
      <div id="levelTag">LEVEL 1</div>
      <div id="comboWrap"><span id="comboVal">0 COMBO</span></div>
      <div id="bestVal">BEST 0</div>
    </div>
  </div>

  <div id="tapCatcher"></div>

  <div id="meterWrap">
    <div id="meterTrack">
      <div id="meterFill"></div>
      <div id="meterSweetSpot"></div>
      <div id="meterNeedle"></div>
    </div>
    <div id="meterHint">화면을 <b>꾹 눌렀다가</b> 딱 맞는 타이밍에 <b>떼서</b> 물병을 세워라!</div>
  </div>

  <!-- Start overlay -->
  <div class="overlay" id="startOverlay">
    <div class="panel">
      <div class="title-main">물병<br>세우기</div>
      <div class="subtitle">겁나 쩌는 보틀 플립 챌린지 💥</div>
      <div class="howto">
        <b>① 누르기</b> — 화면을 누르고 있으면 파워 게이지가 좌우로 움직여요.<br>
        <b>② 놓기</b> — 흰 <b>스윗스팟</b>에 바늘이 왔을 때 손을 떼면 물병이 완벽하게 회전!<br>
        <b>③ 착지</b> — 똑바로 서면 성공, 넘어지면 목숨 -1. 콤보를 쌓아 고득점 도전!
      </div>
      <button class="bigBtn" id="startBtn">시작하기</button>
    </div>
  </div>

  <!-- Game over overlay -->
  <div class="overlay hidden" id="overOverlay">
    <div class="panel">
      <div class="title-main" style="font-size:32px;">GAME OVER</div>
      <div id="gameOverScore">0</div>
      <div id="gameOverBest">BEST 0</div>
      <div id="newBestTag" class="hidden">🏆 최고 기록 경신!</div>
      <button class="bigBtn" id="retryBtn">다시 도전</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------------- storage (best score) ----------------
  let bestScore = 0;
  async function loadBest(){
    try{
      const r = await window.storage.get('bottleflip:best', false);
      if(r && r.value){ bestScore = parseInt(r.value,10) || 0; }
    }catch(e){ /* no saved score yet, fine */ }
    document.getElementById('bestVal').textContent = 'BEST ' + bestScore;
  }
  async function saveBest(v){
    bestScore = v;
    try{ await window.storage.set('bottleflip:best', String(v), false); }catch(e){}
  }
  loadBest();

  // ---------------- canvas setup ----------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W=0,H=0,DPR=1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    const vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    layoutGround();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', resize);
  }

  // ---------------- audio (tiny synth, no assets) ----------------
  let actx=null;
  function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function beep(freq, dur, type, gainMax){
    const c = ac(); if(!c) return;
    const t0 = c.currentTime;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gainMax||0.12, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function sfxCharge(){ beep(220,0.05,'square',0.03); }
  function sfxLaunch(){ beep(340,0.12,'sawtooth',0.09); beep(680,0.10,'sine',0.05); }
  function sfxPerfect(){ [660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'triangle',0.09),i*70)); }
  function sfxGood(){ beep(520,0.14,'triangle',0.08); }
  function sfxFail(){ beep(140,0.28,'sawtooth',0.09); }
  function sfxLose(){ beep(110,0.4,'sawtooth',0.1); }

  // ---------------- world / ground ----------------
  let groundY=0, tableW=180, tableX=0;
  const BASE_TABLE_W = 200;
  function layoutGround(){
    groundY = H - Math.max(110, H*0.16);
    tableX = W/2;
  }

  // ---------------- game state ----------------
  const G = {
    state:'idle',        // idle | charging | flying | landed | shake
    score:0, combo:0, lives:3, level:1,
    power:0,             // 0..1 current meter value
    dir:1,
    holdStart:0,
    bottle:{ x:0, y:0, rot:0, w:34, h:96, vy:0, vx:0, omega:0, inAir:false },
    sweetCenter:0.5, sweetHalf:0.09, // sweet spot on meter (0..1)
    shake:0,
    particles:[],
    popups:[],
    tolerancePerfect:9,  // degrees
    toleranceGood:26,    // degrees
    running:false,
    tableWidth: BASE_TABLE_W,
  };

  const GRAVITY = 2300;        // px/s^2
  const OMEGA_DEG = 640;       // deg/s constant spin rate
  const METER_PERIOD = 1.15;   // seconds per full sweep (there and back)
  const VY_MIN = 420, VY_MAX = 1450;

  function resetBottle(){
    G.bottle.x = tableX;
    G.bottle.y = groundY;
    G.bottle.rot = 0;
    G.bottle.vy = 0; G.bottle.vx=0;
    G.bottle.omega = 0;
    G.bottle.inAir = false;
  }

  function newSweetSpot(){
    // random center away from edges, half-width shrinks slightly as level rises
    G.sweetCenter = 0.28 + Math.random()*0.44;
    G.sweetHalf = Math.max(0.045, 0.10 - (G.level-1)*0.006);
    const track = document.getElementById('meterTrack');
    const sp = document.getElementById('meterSweetSpot');
    const pct1 = (G.sweetCenter - G.sweetHalf)*100;
    const wpct = (G.sweetHalf*2)*100;
    sp.style.left = pct1+'%';
    sp.style.width = wpct+'%';
    sp.style.display = 'block';
  }

  function startRun(){
    G.score=0; G.combo=0; G.lives=3; G.level=1; G.tolerancePerfect=9; G.toleranceGood=26;
    G.tableWidth = BASE_TABLE_W;
    updateHUD();
    resetBottle();
    newSweetSpot();
    G.state='idle';
    G.running = true;
  }

  function updateHUD(){
    document.getElementById('scoreVal').textContent = G.score;
    document.getElementById('hearts').textContent = '❤️'.repeat(Math.max(0,G.lives)) + '🖤'.repeat(3-Math.max(0,G.lives));
    document.getElementById('comboVal').textContent = G.combo + ' COMBO';
    document.getElementById('levelTag').textContent = 'LEVEL ' + G.level;
    document.getElementById('bestVal').textContent = 'BEST ' + Math.max(bestScore, G.score);
  }

  function addPopup(text, x, y, color){
    const el = document.createElement('div');
    el.className='popup';
    el.textContent = text;
    el.style.left = x+'px';
    el.style.top = y+'px';
    if(color) el.style.color = color;
    document.getElementById('stage').appendChild(el);
    setTimeout(()=>el.remove(), 950);
  }

  function spawnConfetti(x,y,color){
    for(let i=0;i<28;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 140+Math.random()*260;
      G.particles.push({
        x:x, y:y,
        vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd - 200,
        life:0.9+Math.random()*0.5, age:0,
        size:3+Math.random()*4,
        color: color || ['#37f0ff','#ff3d81','#c8ff33','#ffd23f'][i%4],
        rot: Math.random()*360, vrot:(Math.random()-0.5)*720,
      });
    }
  }

  function triggerShake(amt){ G.shake = Math.max(G.shake, amt); }

  // ---------------- input: hold to charge, release to flip ----------------
  const catcher = document.getElementById('tapCatcher');
  const meterFill = document.getElementById('meterFill');
  const meterNeedle = document.getElementById('meterNeedle');

  function onDown(e){
    if(e.cancelable) e.preventDefault();
    if(!G.running) return;
    if(G.state!=='idle') return;
    G.state='charging';
    G.holdStart = performance.now();
    ac(); // unlock audio on gesture
  }
  function onUp(e){
    if(e && e.cancelable) e.preventDefault();
    if(G.state!=='charging') return;
    launchBottle(G.power);
  }
  function onCancel(e){
    // finger slid off / interrupted — just cancel the charge, don't launch
    if(G.state==='charging'){ G.state='idle'; G.power=0; meterFill.style.width='0%'; meterNeedle.style.left='0%'; }
  }

  if(window.PointerEvent){
    catcher.addEventListener('pointerdown', onDown);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  } else {
    // fallback for older browsers without Pointer Events support
    catcher.addEventListener('mousedown', onDown);
    catcher.addEventListener('touchstart', onDown, {passive:false});
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp, {passive:false});
    window.addEventListener('touchcancel', onCancel, {passive:false});
  }
  window.addEventListener('keydown', function(e){
    if(e.code==='Space' && G.state==='idle' && G.running){ onDown(e); }
  });
  window.addEventListener('keyup', function(e){
    if(e.code==='Space' && G.state==='charging'){ onUp(e); }
  });
  // buttons are native <button> elements so their own click handlers fire correctly
  // regardless of pointer/touch handling above (no preventDefault reaches them).

  function launchBottle(power){
    G.state='flying';
    document.getElementById('meterSweetSpot').style.display='none';
    const vy0 = -(VY_MIN + power*(VY_MAX-VY_MIN));
    G.bottle.vy = vy0;
    G.bottle.vx = 0;
    G.bottle.omega = OMEGA_DEG; // deg/s
    G.bottle.inAir = true;
    sfxLaunch();

    // Precompute expected landing rotation to decide outcome now (deterministic physics)
    const flightTime = (2*Math.abs(vy0))/GRAVITY; // s, time to return to same height
    const totalRot = (OMEGA_DEG*flightTime) % 360;
    const distFrom0 = Math.min(totalRot, 360-totalRot);
    G.pendingResult = distFrom0 <= G.tolerancePerfect ? 'perfect'
                      : distFrom0 <= G.toleranceGood ? 'good' : 'fail';
    G.pendingFlightTime = flightTime;
  }

  // ---------------- physics/draw loop ----------------
  let lastT = performance.now();
  function frame(t){
    let dt = (t-lastT)/1000; lastT=t;
    dt = Math.min(dt, 0.033);
    update(dt, t);
    draw();
    requestAnimationFrame(frame);
  }

  function update(dt, tNow){
    if(!G.running) return;

    if(G.state==='charging'){
      const elapsed = (tNow - G.holdStart)/1000;
      const phase = (elapsed % METER_PERIOD)/METER_PERIOD; // 0..1
      // triangle wave 0->1->0
      G.power = phase<0.5 ? phase*2 : 2-phase*2;
      meterFill.style.width = (G.power*100)+'%';
      meterNeedle.style.left = (G.power*100)+'%';
    }

    if(G.state==='flying'){
      const b=G.bottle;
      b.vy += GRAVITY*dt;
      b.y += b.vy*dt;
      b.rot += b.omega*dt;
      if(b.y >= groundY){
        b.y = groundY;
        land();
      }
    }

    // shake decay
    if(G.shake>0){ G.shake = Math.max(0, G.shake-dt*22); }

    // particles
    for(let i=G.particles.length-1;i>=0;i--){
      const p=G.particles[i];
      p.age += dt;
      if(p.age>p.life){ G.particles.splice(i,1); continue; }
      p.vy += 900*dt;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.rot += p.vrot*dt;
    }
  }

  function land(){
    const result = G.pendingResult;
    const b = G.bottle;
    b.inAir=false;

    if(result==='perfect' || result==='good'){
      // snap upright visually
      b.rot = 0; b.omega=0; b.vy=0;
      G.combo += 1;
      const base = result==='perfect' ? 220 : 120;
      const gained = base + G.combo*15 + (G.level-1)*10;
      G.score += gained;
      updateHUD();

      const px = b.x, py = groundY - b.h;
      if(result==='perfect'){
        spawnConfetti(px, py, null);
        addPopup('완벽해요! +'+gained, px, py-30, '#c8ff33');
        sfxPerfect();
        triggerShake(6);
      }else{
        addPopup('성공! +'+gained, px, py-30, '#37f0ff');
        sfxGood();
        triggerShake(3);
      }

      if(G.combo>0 && G.combo % 5 === 0){
        G.level += 1;
        G.tolerancePerfect = Math.max(4, G.tolerancePerfect-1);
        G.toleranceGood = Math.max(14, G.toleranceGood-2);
        addPopup('LEVEL UP!', b.x, groundY-160, '#ffd23f');
      }

      G.state='idle';
      resetBottle();
      newSweetSpot();
    } else {
      // fail: bottle topples
      G.combo = 0;
      G.lives -= 1;
      updateHUD();
      sfxFail();
      triggerShake(14);
      addPopup('넘어졌다!', b.x, groundY-120, '#ff3d81');
      b.omega = OMEGA_DEG*0.35; // keep tipping a bit for feedback
      G.state='toppling';
      G.toppleT=0;
      setTimeout(()=>{
        if(G.lives<=0){
          endGame();
        }else{
          G.state='idle';
          resetBottle();
          newSweetSpot();
        }
      }, 650);
    }
  }

  function endGame(){
    G.running=false;
    sfxLose();
    const finalScore = G.score;
    const isNew = finalScore > bestScore;
    if(isNew) saveBest(finalScore);
    document.getElementById('gameOverScore').textContent = finalScore;
    document.getElementById('gameOverBest').textContent = 'BEST ' + Math.max(bestScore, finalScore);
    document.getElementById('newBestTag').classList.toggle('hidden', !isNew);
    document.getElementById('overOverlay').classList.remove('hidden');
  }

  // ---------------- drawing ----------------
  function drawBackdrop(){
    ctx.clearRect(0,0,W,H);
    // grid floor
    const grad = ctx.createLinearGradient(0,groundY-40,0,H);
    grad.addColorStop(0,'rgba(55,240,255,0.06)');
    grad.addColorStop(1,'rgba(255,61,129,0.10)');
    ctx.fillStyle=grad;
    ctx.fillRect(0,groundY,W,H-groundY);

    ctx.strokeStyle='rgba(255,255,255,0.06)';
    ctx.lineWidth=1;
    const horizon = groundY;
    for(let i=1;i<=8;i++){
      const yy = horizon + (H-horizon)*(i/8)*(i/8);
      ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke();
    }
    const vpX = W/2;
    for(let i=-6;i<=6;i++){
      ctx.beginPath();
      ctx.moveTo(vpX + i*70, horizon);
      ctx.lineTo(vpX + i*220, H);
      ctx.stroke();
    }
  }

  function drawTable(){
    const tw = G.tableWidth * DPR/DPR; // css px
    const x = tableX - tw/2, y = groundY, hgt = Math.max(60, H-groundY);
    const grad = ctx.createLinearGradient(0,y,0,y+hgt);
    grad.addColorStop(0,'#3a2a72');
    grad.addColorStop(1,'#1a1035');
    ctx.fillStyle=grad;
    roundRectPath(x,y,tw,hgt+40,[14,14,0,0]);
    ctx.fill();
    ctx.strokeStyle='rgba(200,255,51,0.65)';
    ctx.lineWidth=3;
    ctx.shadowColor='rgba(200,255,51,0.6)';
    ctx.shadowBlur=14;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+tw,y); ctx.stroke();
    ctx.shadowBlur=0;
  }

  function roundRectPath(x,y,w,h,r){
    if(typeof r==='number') r=[r,r,r,r];
    ctx.beginPath();
    ctx.moveTo(x+r[0],y);
    ctx.lineTo(x+w-r[1],y);
    ctx.arcTo(x+w,y,x+w,y+r[1],r[1]);
    ctx.lineTo(x+w,y+h-r[2]);
    ctx.arcTo(x+w,y+h,x+w-r[2],y+h,r[2]);
    ctx.lineTo(x+r[3],y+h);
    ctx.arcTo(x,y+h,x,y+h-r[3],r[3]);
    ctx.lineTo(x,y+r[0]);
    ctx.arcTo(x,y,x+r[0],y,r[0]);
    ctx.closePath();
  }

  function drawBottle(){
    const b = G.bottle;
    const drawY = b.y; // baseline (bottom of bottle) when upright
    ctx.save();
    ctx.translate(b.x, drawY - b.h/2);
    ctx.rotate(b.rot*Math.PI/180);

    // motion blur ghosts while spinning fast
    if(b.inAir && Math.abs(b.omega)>60){
      for(let g=1; g<=3; g++){
        ctx.save();
        ctx.globalAlpha = 0.10;
        ctx.rotate(-g*14*Math.PI/180);
        paintBottleShape();
        ctx.restore();
      }
    }
    paintBottleShape();
    ctx.restore();
  }

  function paintBottleShape(){
    const w = 34, h = 96;
    // cap
    ctx.fillStyle = '#ffd23f';
    roundRectPath(-w*0.22, -h/2-14, w*0.44, 16, 4);
    ctx.fill();
    // neck
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    roundRectPath(-w*0.28, -h/2, w*0.56, 16, 3);
    ctx.fill();
    // body (glass)
    const bodyGrad = ctx.createLinearGradient(-w/2,0,w/2,0);
    bodyGrad.addColorStop(0,'rgba(55,240,255,0.10)');
    bodyGrad.addColorStop(0.5,'rgba(255,255,255,0.20)');
    bodyGrad.addColorStop(1,'rgba(55,240,255,0.10)');
    ctx.fillStyle = bodyGrad;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2;
    roundRectPath(-w/2, -h/2+14, w, h-14, [6,6,12,12]);
    ctx.fill(); ctx.stroke();
    // water fill
    ctx.save();
    roundRectPath(-w/2, -h/2+14, w, h-14, [6,6,12,12]);
    ctx.clip();
    const waterTop = h*0.30; // from bottom
    ctx.fillStyle = 'rgba(55,240,255,0.55)';
    ctx.fillRect(-w/2, h/2-waterTop, w, waterTop);
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.fillRect(-w/2, h/2-waterTop, w, 3);
    ctx.restore();
    // label stripe
    ctx.fillStyle='rgba(255,61,129,0.85)';
    ctx.fillRect(-w/2, -6, w, 14);
  }

  function drawParticles(){
    for(const p of G.particles){
      const alpha = Math.max(0,1-p.age/p.life);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
      ctx.restore();
    }
  }

  function draw(){
    ctx.save();
    if(G.shake>0){
      const dx = (Math.random()-0.5)*G.shake;
      const dy = (Math.random()-0.5)*G.shake;
      ctx.translate(dx,dy);
    }
    drawBackdrop();
    drawTable();
    drawBottle();
    drawParticles();
    ctx.restore();
  }

  // ---------------- boot ----------------
  document.getElementById('startBtn').addEventListener('click', function(){
    document.getElementById('startOverlay').classList.add('hidden');
    startRun();
  });
  document.getElementById('retryBtn').addEventListener('click', function(){
    document.getElementById('overOverlay').classList.add('hidden');
    startRun();
  });

  resize();
  updateHUD();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

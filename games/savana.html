<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사바나 사냥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --umber:rgba(38,24,15,.76);
  --umber-solid:#26180f;
  --bone:#f6ecd6;
  --bone-dim:#d3c3a0;
  --ochre:#e3a93c;
  --grass:#86b85c;
  --blood:#d9503a;
  --line:rgba(246,236,214,.24);
  --page:#1c120b;
  --display:'Black Han Sans','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --text:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --umber:rgba(30,18,10,.8); --page:#150d07; }
}
:root[data-theme="dark"]{ --umber:rgba(30,18,10,.8); --page:#150d07; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--page);color:var(--bone);font-family:var(--text);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#view{position:fixed;left:0;top:0;width:100%;height:100%;display:block;background:var(--page)}

/* 몰입형 HUD */
#hud,#touch{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none}
body:not(.playing) #hud,body:not(.playing) #labels,body:not(.playing) #dmgLayer,body:not(.playing) #hurt{display:none}
.panel{background:var(--umber);border-left:3px solid var(--ochre);padding:8px 12px}
.bar{display:block;height:8px;background:rgba(246,236,214,.16);overflow:hidden}
.bar b{display:block;height:100%;width:100%;background:var(--grass)}
.num{font-family:var(--display);font-weight:400}

#stats{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));width:210px}
#stats .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--bone-dim);margin-bottom:5px}
#stats .row .num{font-size:22px;color:var(--bone)}
#stats .row2{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--bone-dim)}
#stats .row2 b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ochre);margin-left:4px}

#ammo{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));min-width:130px;text-align:right}
#ammo .mag{display:flex;justify-content:flex-end;align-items:baseline;gap:6px}
#ammo .mag b{font-family:var(--display);font-weight:400;font-size:38px;line-height:1}
#ammo .mag span{font-size:15px;color:var(--bone-dim)}
#ammo .bar{height:5px;margin-top:6px}
#ammo .bar b{background:var(--ochre);width:0}
#rlText{font-size:12px;color:var(--bone-dim);height:16px;margin-top:4px}
body.touch #ammo{bottom:auto;top:calc(118px + env(safe-area-inset-top,0px))}

#target{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  width:min(250px,44vw);text-align:center;opacity:0;transition:opacity .12s;border-left:0;border-bottom:3px solid var(--ochre)}
#target.on{opacity:1}
#tName{font-family:var(--display);font-size:22px;line-height:1.1;margin-bottom:6px}
#tHp{font-size:12px;color:var(--bone-dim);margin-top:5px}

#toast{position:absolute;left:50%;top:calc(104px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  font-family:var(--display);font-size:22px;white-space:nowrap;color:var(--bone);text-shadow:0 2px 6px rgba(0,0,0,.75);opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#hint{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font-size:13px;color:var(--bone);text-shadow:0 1px 4px rgba(0,0,0,.8);opacity:0;transition:opacity .6s;text-align:center;width:min(90vw,560px)}
#hint.on{opacity:.92}
body.touch #hint{bottom:calc(150px + env(safe-area-inset-bottom,0px))}

#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross i{position:absolute;background:rgba(246,236,214,.94);box-shadow:0 0 2px rgba(0,0,0,.75)}
#cross .l{width:10px;height:2px;left:-19px;top:-1px}
#cross .r{width:10px;height:2px;left:9px;top:-1px}
#cross .t{width:2px;height:10px;left:-1px;top:-19px}
#cross .b{width:2px;height:10px;left:-1px;top:9px}
#cross .d{width:4px;height:4px;left:-2px;top:-2px;border-radius:50%;background:var(--blood)}
#hitm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;transition:opacity .14s}
#hitm.on{opacity:1;transition:none}
#hitm::before,#hitm::after{content:'';position:absolute;left:50%;top:-4px;width:2px;height:34px;background:var(--bone);transform:translateX(-50%) rotate(45deg)}
#hitm::after{transform:translateX(-50%) rotate(-45deg)}
#hitm.head::before,#hitm.head::after{background:var(--blood)}

#hurt{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(217,80,58,0) 42%,rgba(217,80,58,.7) 100%)}
#dmgLayer{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none}
.dmg{position:absolute;font-family:var(--display);font-size:22px;color:var(--bone);white-space:nowrap;
  text-shadow:0 2px 4px rgba(0,0,0,.8);animation:rise .85s ease-out forwards}
.dmg.head{color:var(--ochre);font-size:26px}
@keyframes rise{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(-50%,-200%);opacity:0}}
@keyframes fade{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(-50%,-50%);opacity:0}}
@media (prefers-reduced-motion: reduce){ .dmg{animation-name:fade} }

/* 동물 이름표 */
#labels{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;display:none;align-items:center;gap:6px;padding:3px 8px 4px;
  background:rgba(38,24,15,.68);color:var(--bone);font-size:12px;font-weight:700;white-space:nowrap;border-radius:4px;will-change:transform}
.tag .hpn{font-weight:500;color:var(--bone-dim);font-variant-numeric:tabular-nums}
.tag .bar{width:44px;height:5px}
.tag.pred .nm{color:#ffb39c}
.tag.mon .nm{color:#c9b0ff}

#clock{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));width:190px}
#clock .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--bone-dim);margin-bottom:5px}
#clock .row b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--bone)}
#clock .bar b{width:0}
#tentRow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--bone)}
#arrow{display:inline-block;width:18px;text-align:center;color:var(--ochre);font-size:15px;line-height:1}
#safeTag{margin-left:auto;font-weight:700}
#safeTag.ok{color:var(--grass)}
#safeTag.bad{color:var(--blood)}
#prompt{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 14px;
  background:var(--umber);border-left:0;border-bottom:3px solid var(--ochre);font-size:14px;opacity:0;transition:opacity .2s;white-space:nowrap}
#prompt.on{opacity:1}
#fade{position:fixed;left:0;top:0;right:0;bottom:0;background:#05060d;opacity:0;pointer-events:none;z-index:5}
@media (max-width:640px){
  #stats{width:150px} #clock{width:150px} #tentRow{font-size:12px;gap:5px}
  #target{top:calc(116px + env(safe-area-inset-top,0px))}
  #toast{top:calc(176px + env(safe-area-inset-top,0px));font-size:19px}
}

#slots{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px}
body.touch #slots{display:none}
.chip{padding:5px 10px;background:var(--umber);color:var(--bone-dim);font-size:12.5px;border-bottom:3px solid transparent;white-space:nowrap}
.chip.on{color:var(--bone);border-bottom-color:var(--ochre);background:rgba(66,42,24,.92)}
.chip.empty{opacity:.55}
#boss{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(380px,40vw);
  text-align:center;opacity:0;transition:opacity .25s;border-left:0;border-bottom:3px solid #8f6cf0}
#boss.on{opacity:1}
#bossName{font-family:var(--display);font-size:20px;color:#d6c4ff;margin-bottom:6px}
#boss .bar b{background:#8f6cf0}
#bossHp{font-size:12px;color:var(--bone-dim);margin-top:5px}
body.boss #target{top:calc(94px + env(safe-area-inset-top,0px))}
body.boss #toast{top:calc(160px + env(safe-area-inset-top,0px))}
@media (max-width:860px){
  #boss{top:calc(116px + env(safe-area-inset-top,0px));width:min(380px,calc(100vw - 24px))}
  body.boss #target{top:calc(176px + env(safe-area-inset-top,0px))}
  body.boss #toast{top:calc(236px + env(safe-area-inset-top,0px))}
}
#swap{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9;display:flex;padding:24px;background:rgba(14,8,4,.8);touch-action:auto;overflow-y:auto}
#swap[hidden]{display:none}
#swapCard{margin:auto;width:min(480px,100%)}
#swapCard h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);margin:0 0 8px}
#swapSub{margin:0 0 6px;font-size:15px;line-height:1.6;color:var(--bone-dim)}
#swapNew{margin:0 0 16px;font-size:14px;color:var(--ochre)}
#swapList{display:grid;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;text-align:left;background:var(--umber);color:var(--bone);
  border:1px solid var(--line);border-left:3px solid var(--blood);font:inherit;cursor:pointer}
.opt b{font-size:16px}
.opt span{font-size:12.5px;color:var(--bone-dim)}
.opt.skip{border-left-color:var(--grass)}
.opt:hover{background:rgba(70,44,26,.94)}
.opt:focus-visible{outline:3px solid var(--bone);outline-offset:2px}

#fx{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(118px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:4px;width:210px}
.fxtag{padding:2px 8px;background:var(--umber);font-size:12px;color:var(--bone);border-left:3px solid var(--ochre);display:none}
#items{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(152px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;pointer-events:auto}
.item{display:flex;justify-content:space-between;gap:12px;min-width:158px;padding:4px 10px;background:var(--umber);color:var(--bone);border:0;
  border-left:3px solid var(--ochre);font:inherit;font-size:12.5px;text-align:left;cursor:pointer}
.item:focus-visible{outline:2px solid var(--bone)}
.item.empty{opacity:.42}
.item b{font-weight:700}

#zoneName{font-size:12px;color:var(--bone-dim);margin-top:6px}
.fxtag.art{border-left-color:#6fe7ff}
details{margin:0 0 6px}
summary{cursor:pointer;font-weight:700;padding:4px 0;color:var(--bone)}
summary:focus-visible{outline:2px solid var(--bone)}
details .beasts{margin:4px 0 8px}

/* 터치 조작 */
#touch{display:none}
body.touch.playing #touch{display:block}
#stick{position:absolute;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));
  width:120px;height:120px;border-radius:50%;border:2px solid var(--line);background:rgba(38,24,15,.3);opacity:.6}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(246,236,214,.6)}
.tbtn{position:absolute;pointer-events:auto;border:2px solid var(--line);background:var(--umber);color:var(--bone);
  font:700 14px var(--text);border-radius:50%;width:62px;height:62px;padding:0}
#tFire{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:88px;height:88px;background:rgba(217,80,58,.82);font-size:17px}
#tReload{right:calc(122px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px))}
#tJump{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(166px + env(safe-area-inset-bottom,0px))}
#tSleep{display:none;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(168px + env(safe-area-inset-bottom,0px));width:78px;height:78px;background:rgba(80,100,190,.85)}
body.canUse #tSleep{display:block}
#tWeapon{right:calc(196px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px))}
#tZoom{right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(126px + env(safe-area-inset-bottom,0px))}

/* 안내 화면 */
#overlay{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;padding:24px;z-index:10;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 65%,rgba(38,24,15,.5),rgba(18,10,5,.9));touch-action:auto}
#overlay[hidden]{display:none}
#card{margin:auto;width:min(560px,100%);padding:8px 0}
#ovTitle{font-family:var(--display);font-weight:400;font-size:clamp(42px,10vw,80px);line-height:1.02;margin:0 0 14px;letter-spacing:-.01em}
#ovSub{font-size:16px;line-height:1.65;color:var(--bone-dim);margin:0 0 20px;max-width:46ch}
#ovStats{display:flex;gap:28px;margin:0 0 22px}
#ovStats[hidden]{display:none}
#ovStats div{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--bone-dim)}
#ovStats b{font-family:var(--display);font-weight:400;font-size:34px;color:var(--ochre);line-height:1.1}
#ovInfo[hidden]{display:none}
.beasts{display:grid;grid-template-columns:auto auto auto 1fr;gap:6px 18px;font-size:14px;margin:0 0 20px;padding:12px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.beasts .bn{font-weight:700;color:var(--bone)}
.beasts .bn.pred{color:#ffb39c}
.beasts .bn.mon{color:#c9b0ff}
.beasts span{color:var(--bone-dim)}
.ctrls{display:grid;grid-template-columns:auto 1fr;gap:5px 18px;font-size:14px;margin:0 0 24px}
.ctrls dt{color:var(--bone-dim)}
.ctrls dd{margin:0;color:var(--bone)}
.note{font-size:12.5px;color:var(--bone-dim);line-height:1.6;margin:-10px 0 22px;max-width:52ch}
.cta{font-family:var(--display);font-size:24px;padding:12px 40px;background:var(--ochre);color:var(--umber-solid);border:0;border-radius:4px;cursor:pointer}
.cta:hover{filter:brightness(1.08)}
.cta:focus-visible{outline:3px solid var(--bone);outline-offset:3px}
.cta[hidden]{display:none}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="dmgLayer"></div>
<div id="hurt"></div>
<div id="fade"></div>

<div id="hud">
  <div id="stats" class="panel">
    <div class="row"><span>체력</span><span class="num" id="hpNum">100</span></div>
    <i class="bar"><b id="hpBar"></b></i>
    <div class="row2"><span>점수<b id="score">0</b></span><span>처치<b id="kills">0</b></span></div>
  </div>
  <div id="clock" class="panel">
    <div class="row"><b id="dayNo">1일차</b><span id="phase">낮</span></div>
    <i class="bar"><b id="clockBar"></b></i>
    <div id="zoneName"></div>
    <div id="tentRow"><span id="arrow">▲</span><span id="tentDist">텐트</span><span id="safeTag"></span></div>
  </div>
  <div id="fx"></div>
  <div id="items"></div>
  <div id="boss" class="panel">
    <div id="bossName">-</div>
    <i class="bar"><b id="bossFill"></b></i>
    <div id="bossHp">-</div>
  </div>
  <div id="slots"></div>
  <div id="prompt"></div>
  <div id="target" class="panel">
    <div id="tName">-</div>
    <i class="bar"><b id="tBar"></b></i>
    <div id="tHp">-</div>
  </div>
  <div id="toast"></div>
  <div id="cross"><i class="l"></i><i class="r"></i><i class="t"></i><i class="b"></i><i class="d"></i></div>
  <div id="hitm"></div>
  <div id="ammo" class="panel">
    <div class="mag"><b id="mag">10</b><span id="reserve">/ 50</span></div>
    <i class="bar"><b id="rlBar"></b></i>
    <div id="rlText"></div>
  </div>
  <div id="hint"></div>
</div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <button class="tbtn" id="tSleep" type="button">잠자기</button>
  <button class="tbtn" id="tWeapon" type="button">무기</button>
  <button class="tbtn" id="tZoom" type="button">확대</button>
  <button class="tbtn" id="tJump" type="button">점프</button>
  <button class="tbtn" id="tReload" type="button">장전</button>
  <button class="tbtn" id="tFire" type="button">공격</button>
</div>

<div id="swap" hidden>
  <div id="swapCard">
    <h2 id="swapTitle">무기가 가득 찼습니다</h2>
    <p id="swapSub"></p>
    <p id="swapNew"></p>
    <div id="swapList"></div>
  </div>
</div>

<div id="overlay">
  <div id="card">
    <h1 id="ovTitle">사바나 사냥</h1>
    <p id="ovSub"></p>
    <div id="ovStats" hidden>
      <div>점수<b id="ovScore">0</b></div>
      <div>처치<b id="ovKills">0</b></div>
      <div>일차<b id="ovDay">1</b></div>
      <div>최고 점수<b id="ovBest">0</b></div>
    </div>
    <div id="ovInfo"></div>
    <button id="btnStart" class="cta" type="button">시작하기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* ================= 유틸 ================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
function angleDiff(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

const el = {
  canvas: $('view'), overlay: $('overlay'), ovTitle: $('ovTitle'), ovSub: $('ovSub'), ovStats: $('ovStats'),
  ovScore: $('ovScore'), ovKills: $('ovKills'), ovBest: $('ovBest'), ovInfo: $('ovInfo'), btnStart: $('btnStart'),
  labels: $('labels'), hpBar: $('hpBar'), hpNum: $('hpNum'), score: $('score'), kills: $('kills'),
  mag: $('mag'), reserve: $('reserve'), rlBar: $('rlBar'), rlText: $('rlText'),
  target: $('target'), tName: $('tName'), tBar: $('tBar'), tHp: $('tHp'),
  toast: $('toast'), hitm: $('hitm'), hurt: $('hurt'), dmgLayer: $('dmgLayer'), hint: $('hint'),
  stick: $('stick'), knob: $('knob'), tFire: $('tFire'), tReload: $('tReload'), tJump: $('tJump'), tZoom: $('tZoom'), tSleep: $('tSleep'), tWeapon: $('tWeapon'),
  dayNo: $('dayNo'), phase: $('phase'), clockBar: $('clockBar'), arrow: $('arrow'), tentDist: $('tentDist'), safeTag: $('safeTag'),
  prompt: $('prompt'), fade: $('fade'), ovDay: $('ovDay'),
  slots: $('slots'), boss: $('boss'), bossName: $('bossName'), bossHp: $('bossHp'), bossFill: $('bossFill'),
  fx: $('fx'), items: $('items'), zoneName: $('zoneName'), swapTitle: $('swapTitle'),
  swap: $('swap'), swapSub: $('swapSub'), swapNew: $('swapNew'), swapList: $('swapList')
};

function fatal(msg) {
  el.ovTitle.textContent = '실행할 수 없습니다';
  el.ovSub.textContent = msg;
  el.ovInfo.hidden = true;
  el.ovStats.hidden = true;
  el.btnStart.hidden = true;
  el.overlay.hidden = false;
}

if (typeof THREE === 'undefined') {
  fatal('3D 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 열어 주세요.');
  return;
}

let isTouch = false;
try {
  isTouch = (('ontouchstart' in window) || navigator.maxTouchPoints > 0) && window.matchMedia('(pointer: coarse)').matches;
} catch (e) { isTouch = false; }
if (isTouch) document.body.classList.add('touch');

let renderer;
try {

const WORLD = 320, HALF = WORLD / 2;
function rawHeight(x, z) {
  return Math.sin(x * 0.021 + 1.3) * Math.cos(z * 0.017) * 3.2
       + Math.sin(x * 0.05 + z * 0.043) * 0.9
       + Math.cos(z * 0.031 - x * 0.012) * 1.6;
}
// 텐트 주변은 평평하게 다진다
const TENT_X = 10, TENT_Z = -16;
const TENT_H = rawHeight(TENT_X, TENT_Z);
const ZONE_ORDER = ['desert', 'snow', 'jungle', 'volcano'];
const TEMPLE_POS = { desert: { x: -105, z: 100 }, snow: { x: 108, z: 98 }, jungle: { x: -102, z: -104 }, volcano: { x: 104, z: -108 } };
const PLATEAUS = [{ x: TENT_X, z: TENT_Z, h: TENT_H, r0: 9, r1: 17 }];
for (const zid of ZONE_ORDER) {
  const tp = TEMPLE_POS[zid];
  PLATEAUS.push({ x: tp.x, z: tp.z, h: rawHeight(tp.x, tp.z), r0: 15, r1: 24 });
}
function heightAt(x, z) {
  let h = rawHeight(x, z);
  for (let i = 0; i < PLATEAUS.length; i++) {
    const P = PLATEAUS[i];
    const d = Math.hypot(x - P.x, z - P.z);
    if (d >= P.r1) continue;
    const k = d <= P.r0 ? 1 : 1 - (d - P.r0) / (P.r1 - P.r0);
    h += (P.h - h) * (k * k * (3 - 2 * k));
  }
  return h;
}
// 텐트나 신전 근처인지 (소품과 동물 배치를 피하기 위해)
function nearSpecial(x, z, rt, rp) {
  if (Math.hypot(x - TENT_X, z - TENT_Z) < rt) return true;
  for (const id of ZONE_ORDER) { const T = TEMPLE_POS[id]; if (Math.hypot(x - T.x, z - T.z) < rp) return true; }
  return false;
}

function rebuildCollision() {
  obstacles.length = 0;
  blockers.length = 0;
  for (const o of campObstacles) obstacles.push(o);
  for (const b of campBlockers) blockers.push(b);
  const P = zoneProps[zone];
  if (P) {
    for (const o of P.obstacles) obstacles.push(o);
    for (const b of P.blockers) blockers.push(b);
  }
}
function applyZoneEnv(id) {
  const Z = ZONES[id];

  if (!zoneProps[id]) buildZoneProps(id);
  for (const k of ZONE_ORDER) { if (zoneProps[k]) zoneProps[k].group.visible = (k === id); }
  paintGround(Z.ground);

  cFogDay.setHex(Z.fogDay);
  cFogNight.setHex(Z.fogNight);
  mountainMat.color.setHex(Z.mount);

  rebuildCollision();
}

  for (const a of animals) disposeAnimal(a);

}

function pickWeighted(list) {
  let t = 0;
  for (const e of list) t += e[1];
  let r = Math.random() * t;
  for (const e of list) { r -= e[1]; if (r <= 0) return e[0]; }
  return list[0][0];
}
const POTION_IDS = ['heal', 'speed', 'power', 'shield', 'vision'];
function rollLoot(boss) {
  if (boss) return { type: 'weapon', id: pickWeighted([['axe', 15], ['spear', 15], ['shotgun', 20], ['rifle', 25], ['sword', 15], ['hammer', 10]]) };
  const r = Math.random();
  if (r < 0.45) return { type: 'weapon', id: pickWeighted(LOOT_WEAPONS.concat(ZONES[zone].loot)) };
  if (r < 0.59) return { type: 'ammo' };
  if (r < 0.69) return { type: 'med' };
  if (r < 0.87) return { type: 'potion', id: POTION_IDS[Math.floor(Math.random() * POTION_IDS.length)] };
  return { type: 'bomb' };
}
const legendGem = new THREE.MeshBasicMaterial({ color: 0xb48cff });
const artGem = new THREE.MeshBasicMaterial({ color: 0x6fe7ff });

function spawnBox(x, z, loot, opt) {
  const L = loot || rollLoot(false);
  const o = opt || {};
  const g = new THREE.Group();
  g.position.set(x, heightAt(x, z), z);
  const body = new THREE.Mesh(crateBodyGeo, crateWood); body.position.y = 0.3; g.add(body);
  const lid = new THREE.Mesh(crateLidGeo, crateMetal); lid.position.y = 0.63; g.add(lid);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const post = new THREE.Mesh(cratePostGeo, crateMetal); post.position.set(sx * 0.42, 0.31, sz * 0.42); g.add(post);
  }
  const gemMat = L.type === 'legend' ? legendGem : (L.type === 'artifact' ? artGem : crateGem);
  const gem = new THREE.Mesh(crateGemGeo, gemMat);
  gem.position.y = 1.5;
  if (o.hidden) gem.scale.setScalar(0.6);
  g.add(gem);
  if (!o.hidden) {
    const bm = L.type === 'legend' ? legendBeamMat : (L.type === 'artifact' ? artBeamMat : crateBeamMat);
    const beam = new THREE.Mesh(crateBeamGeo, bm);
    beam.position.y = 4.6;
    if (L.type === 'legend') beam.scale.set(1.4, 1.5, 1.4);
    g.add(beam);
  }
  g.rotation.y = rand(0, TAU);
  scene.add(g);
  const b = { x: x, z: z, g: g, gem: gem, loot: L, t: rand(0, TAU), hidden: !!o.hidden, keep: !!(o.keep || o.hidden), reward: null };
  boxes.push(b);
  return b;
}

function findBoxSpot(minPlayer) {
  for (let i = 0; i < 60; i++) {
    const x = rand(-HALF + 12, HALF - 12), z = rand(-HALF + 12, HALF - 12);
    if (nearSpecial(x, z, 16, 24)) continue;
    if (Math.hypot(x - player.pos.x, z - player.pos.z) < minPlayer) continue;
    if (blockedAt(x, z, 2)) continue;
    let ok = true;
    for (const b of boxes) { if (Math.hypot(x - b.x, z - b.z) < 22) { ok = false; break; } }
    if (ok) return { x: x, z: z };
  }
  return null;
}
function spawnInitialBoxes() {
  const ZS = zoneState[zone];
  for (const r of ZS.rewards) { const rb = spawnBox(r.x, r.z, r.loot, { keep: true }); rb.reward = r; }
  for (let i = 0; i < BOX_MAX; i++) { const p = findBoxSpot(8); if (p) spawnBox(p.x, p.z); }
  if (!ZS.hiddenOpened) {
    const H = ZONES[zone].hidden;
    let hx = H.x, hz = H.z;
    for (let k = 0; k < 12 && blockedAt(hx, hz, 2); k++) { hx += rand(-6, 6); hz += rand(-6, 6); }
    hx = clamp(hx, -HALF + 8, HALF - 8); hz = clamp(hz, -HALF + 8, HALF - 8);
    spawnBox(hx, hz, { type: 'artifact' }, { hidden: true, keep: true });
  }
}
function clearBoxes() {

const CYCLE = 300;   // 하루(초)
const world = { time: 0.15 * CYCLE, q: 0.15, day: 1, dayNo: 1, lastDayNo: 1, spawnT: 2, warnedDusk: false, warnedNight: false, bossSpawned: false, boxT: 10 };
const sleep = { on: false, t: 0, did: false, kind: 'rest', target: '' };
function sstep(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function dayFactor(q) {
  if (q < 0.12) return sstep(q / 0.12);
  if (q < 0.6) return 1;
  if (q < 0.76) return 1 - sstep((q - 0.6) / 0.16);
  return 0;
}
function computeWorld() {
  const x = world.time / CYCLE;
  world.q = x - Math.floor(x);
  world.dayNo = Math.floor(x) + 1;
  world.day = dayFactor(world.q);
}

const cFogDay = new THREE.Color(0xe9d3a4), cFogNight = new THREE.Color(0x0b1022), cDusk = new THREE.Color(0xe8955a);
const cHemiD = new THREE.Color(0xcfe4ff), cHemiN = new THREE.Color(0x3a4f90), cGndD = new THREE.Color(0xb59a5a), cGndN = new THREE.Color(0x181826);
const cSunL = new THREE.Color(0xfff0cf), cMoonL = new THREE.Color(0x8fa6ff), cDuskL = new THREE.Color(0xff9a55);
const cWhite = new THREE.Color(0xffffff), cSkyNight = new THREE.Color(0x121a38), cCloudNight = new THREE.Color(0x232b45);
const _fog = new THREE.Color(), _sd = new THREE.Vector3(), _md = new THREE.Vector3();
function arcDir(a, out) { return out.set(-Math.cos(a) * 0.85, Math.sin(a), -0.45).normalize(); }

function applyTime(now) {
  computeWorld();
  const d = world.day, q = world.q;
  const n = clamp((0.5 - d) * 2, 0, 1);
  const dusk = Math.sin(clamp(1 - d, 0, 1) * Math.PI);
  _fog.copy(cFogNight).lerp(cFogDay, d).lerp(cDusk, dusk * 0.35);
  scene.fog.color.copy(_fog);
  scene.background.copy(_fog);
  scene.fog.near = 25 + 45 * d;
  scene.fog.far = 135 + 145 * d;
  hemi.color.copy(cHemiN).lerp(cHemiD, d);
  hemi.groundColor.copy(cGndN).lerp(cGndD, d);
  hemi.intensity = 0.45 + 0.45 * d;
  if (player.fx.vision > 0) { hemi.intensity += 0.4; scene.fog.far = Math.max(scene.fog.far, 230); scene.fog.near = Math.max(scene.fog.near, 60); }

  const sunUp = q < 0.72;
  arcDir((q / 0.72) * Math.PI, _sd);
  arcDir(q >= 0.72 ? ((q - 0.72) / 0.28) * Math.PI : -0.3, _md);
  const L = sunUp ? _sd : _md;
  sunLight.position.set(L.x * 200, Math.max(L.y, 0.25) * 200, L.z * 200);
  sunLight.color.copy(cMoonL).lerp(cSunL, d).lerp(cDuskL, dusk * 0.5);
  sunLight.intensity = 0.38 + 0.47 * d;
  sky.material.color.copy(cWhite).lerp(cSkyNight, 1 - d).lerp(cDusk, dusk * 0.18);

  const cp = camera.position;
  sky.position.copy(cp);
  stars.position.copy(cp);
  sunMesh.visible = sunUp && _sd.y > -0.08;
  sunMesh.position.copy(cp).addScaledVector(_sd, 420);
  sunMesh.material.color.setHex(0xfff4d0).lerp(cDuskL, clamp((0.4 - _sd.y) * 2, 0, 1));
  moonMesh.visible = !sunUp && _md.y > -0.08;
  moonMesh.position.copy(cp).addScaledVector(_md, 420);
  stars.visible = n > 0.02;
  starMat.opacity = n * 0.95;
  cloudMat.color.copy(cWhite).lerp(cCloudNight, 1 - d);

  const fl = 0.85 + 0.15 * Math.sin(now * 0.021) + 0.1 * Math.sin(now * 0.047);
  fireLight.intensity = (0.3 + 1.5 * (1 - d)) * fl;
  flame1.scale.set(1, 0.9 + fl * 0.3, 1);
  flame2.scale.set(1, 0.9 + (2 - fl) * 0.25, 1);
  beacon.visible = n > 0.02;
  beacon.material.opacity = n * 0.3 * (0.8 + 0.2 * Math.sin(now * 0.003));
}

function tickWorld(dt) {
  if (!sleep.on) world.time += dt;
  computeWorld();
  if (world.dayNo !== world.lastDayNo) {
    world.lastDayNo = world.dayNo;
    world.warnedDusk = false; world.warnedNight = false; world.bossSpawned = false;
    resetBoxes();
    world.boxT = 22;
    setTimeout(function () { if (state.mode === 'play') say('상자가 새로 채워졌습니다'); }, 2500);
    player.score += 50;
    say(world.dayNo + '일차 아침  +50');
  }
  if (world.q > 0.58 && world.q < 0.72 && !world.warnedDusk) { world.warnedDusk = true; say('해가 지고 있습니다. 텐트로 돌아가세요!'); }
  if (world.day < 0.3 && world.q > 0.6 && !world.warnedNight) { world.warnedNight = true; say('밤 괴물이 깨어났습니다. 텐트 안으로!'); }
  world.boxT -= dt;
  if (world.boxT <= 0) {
    world.boxT = 22;
    if (boxes.length < BOX_MAX) { const p = findBoxSpot(30); if (p) spawnBox(p.x, p.z); }
  }
}

function trySleep() {
  if (state.mode !== 'play' || sleep.on || player.dead) return;
  if (!player.safe) { say('텐트 안에서만 잠을 잘 수 있습니다'); return; }
  if (world.q < 0.55) { say('아직 잠잘 시간이 아닙니다'); return; }
  sleep.on = true; sleep.t = 0; sleep.did = false; sleep.kind = 'rest';
  input.fire = false;
}
function doWake() {
  if (sleep.kind === 'travel') { sleep.kind = 'rest'; switchZone(sleep.target); return; }
  world.time = (Math.floor(world.time / CYCLE) + 1) * CYCLE + 0.05 * CYCLE;
  for (let i = animals.length - 1; i >= 0; i--) {
    if (isNightMonster(animals[i])) { disposeAnimal(animals[i]); animals.splice(i, 1); }
  }
  player.sinceHurt = 99;
  if (sleep.kind === 'boss') {
    player.hp = Math.min(player.maxHp, player.hp + 60);
    player.reserve = Math.min(ammoCap(), player.reserve + 15);
  } else {
    player.hp = player.maxHp;
    player.reserve = Math.min(ammoCap(), player.reserve + 10);
  }
  sleep.kind = 'rest';
}
function updateSleep(dt) {
  sleep.t += dt;
  let f;
  if (sleep.t < 0.9) f = sleep.t / 0.9;
  else {
    if (!sleep.did) { sleep.did = true; doWake(); }
    const u = sleep.t - 0.9;
    f = u < 0.4 ? 1 : 1 - (u - 0.4) / 0.9;
    if (u >= 1.3) { sleep.on = false; f = 0; }
  }
  el.fade.style.opacity = clamp(f, 0, 1).toFixed(2);
}

function isNightMonster(a) { return a.t.monster && !a.t.tboss && !a.t.guard; }
const BOSS_KEYS = ['boss1', 'boss2', 'boss3', 'boss4', 'boss5'];
function spawnBoss() {
  const n = world.dayNo - 1;
  const key = BOSS_KEYS[n % BOSS_KEYS.length];
  const scale = 1 + 0.4 * Math.floor(n / BOSS_KEYS.length);
  for (let i = 0; i < 16; i++) {
    const ang = rand(0, TAU), r = rand(38, 52);
    const x = clamp(player.pos.x + Math.cos(ang) * r, -HALF + 8, HALF - 8);
    const z = clamp(player.pos.z + Math.sin(ang) * r, -HALF + 8, HALF - 8);
    if (Math.hypot(x - tent.x, z - tent.z) < 14 || blockedAt(x, z, 3)) continue;
    const a = spawnAnimal(key, 0, { x: x, z: z });
    a.maxHp = Math.round(a.maxHp * scale); a.hp = a.maxHp;
    world.bossSpawned = true;
    const nm = a.t.name;
    setTimeout(function () { if (state.mode === 'play') say(nm + ' 출현! 쓰러뜨리면 밤이 끝납니다'); }, 2600);
    return;
  }
}

function bossDefeated(a) {
  spawnRewardBox(clamp(a.g.position.x, -HALF + 6, HALF - 6), clamp(a.g.position.z, -HALF + 6, HALF - 6), rollLoot(true));
  say(a.t.name + ' 처치! 밤이 끝납니다');
  sleep.on = true; sleep.t = 0; sleep.did = false; sleep.kind = 'boss';
  input.fire = false;
}

function spawnMonsters(dt) {
  if (world.day >= 0.3 || sleep.on) return;
  if (!world.bossSpawned && world.q > 0.6) spawnBoss();
  world.spawnT -= dt;
  if (world.spawnT > 0) return;
  let alive = 0, brutes = 0;
  for (const a of animals) { if (isNightMonster(a) && !a.dead && !a.vanishing) { alive++; if (a.key === 'brute') brutes++; } }
  world.spawnT = rand(2, 3.5);
  if (alive >= Math.min(10, 3 + (world.dayNo - 1) * 2)) return;
  const key = (world.dayNo >= 2 && brutes < Math.min(3, world.dayNo - 1) && Math.random() < 0.25) ? 'brute' : 'shade';
  for (let i = 0; i < 12; i++) {
    const ang = rand(0, TAU), r = rand(28, 40);
    const x = clamp(player.pos.x + Math.cos(ang) * r, -HALF + 6, HALF - 6);
    const z = clamp(player.pos.z + Math.sin(ang) * r, -HALF + 6, HALF - 6);
    if (Math.hypot(x - tent.x, z - tent.z) < 12 || blockedAt(x, z, 2)) continue;
    spawnAnimal(key, 0, { x: x, z: z });
    return;
  }
}

/* ================= 소리 ================= */
let actx = null, noiseBuf = null;
function audioInit() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      const len = Math.floor(actx.sampleRate * 0.5);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(type, f0, f1, dur, vol) {
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfx(kind) {
  if (!actx) return;
  try {
    if (kind === 'shot') {
      const s = actx.createBufferSource();
      s.buffer = noiseBuf;
      const f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 1800;
      const g = actx.createGain(); g.gain.value = 0.5;
      s.connect(f); f.connect(g); g.connect(actx.destination);
      s.start(actx.currentTime);
      tone('sine', 150, 40, 0.18, 0.5);
    } else if (kind === 'hit') { tone('triangle', 700, 320, 0.09, 0.16); }
    else if (kind === 'empty') { tone('square', 900, 700, 0.04, 0.08); }
    else if (kind === 'reload') { tone('square', 500, 350, 0.05, 0.07); setTimeout(function () { try { if (actx) tone('square', 420, 300, 0.06, 0.07); } catch (e) {} }, 700); }
    else if (kind === 'hurt') { tone('sawtooth', 200, 60, 0.25, 0.22); }
    else if (kind === 'swing') { tone('sawtooth', 950, 260, 0.11, 0.07); }
    else if (kind === 'drink') { tone('sine', 380, 760, 0.16, 0.12); }
    else if (kind === 'boom') {
      const bs = actx.createBufferSource();
      bs.buffer = noiseBuf;
      const bf = actx.createBiquadFilter(); bf.type = 'lowpass'; bf.frequency.value = 700;
      const bg = actx.createGain(); bg.gain.value = 0.9;
      bs.connect(bf); bf.connect(bg); bg.connect(actx.destination);
      bs.start(actx.currentTime);
      tone('sine', 95, 28, 0.5, 0.6);
    }
  } catch (e) { /* 소리 오류는 무시 */ }
}

/* ================= 동물 모델 ================= */
const geoCache = Object.create(null);
function boxGeo(w, h, l) {
  const k = w.toFixed(3) + '_' + h.toFixed(3) + '_' + l.toFixed(3);
  return geoCache[k] || (geoCache[k] = new THREE.BoxGeometry(w, h, l));
}
const shadowGeo = new THREE.CircleGeometry(1, 20);
const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.26, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });

function buildAnimal(key) {
  const t = TYPES[key];
  const look = t.look || key;
  const g = new THREE.Group();
  g.rotation.order = 'YXZ';
  const mats = [], hitMeshes = [], legs = [];
  const mk = function (c) { const m = new THREE.MeshLambertMaterial({ color: c }); mats.push(m); return m; };
  const matBody = mk(t.body), matDark = mk(t.dark), matLight = mk(t.light), matBlack = mk(0x0d0a08);
  const extra = [];
  const glowy = !!(t.monster || t.glow);
  const matEye = glowy ? new THREE.MeshBasicMaterial({ color: t.eye || 0xff4a2e, fog: false }) : matBlack;
  if (glowy) extra.push(matEye);
  const es = glowy ? 0.075 : 0.035;

  // flag: 'head' = 머리(헤드샷), 'deco' = 장식(피격 판정 없음)
  function part(parent, w, h, l, mat, x, y, z, flag) {
    const m = new THREE.Mesh(boxGeo(w, h, l), mat);
    m.position.set(x, y, z);
    if (flag === 'head') m.userData.part = 'head';
    parent.add(m);
    if (flag !== 'deco') hitMeshes.push(m);
    return m;
  }

  const bodyY = t.legH + t.bh / 2;
  part(g, t.w, t.bh, t.len, matBody, 0, bodyY, 0);

  // 다리 (엉덩이/어깨 피벗에서 흔들림)
  const lx = t.w * 0.36, lz = t.len / 2 - t.legT - 0.06;
  const legDefs = [[lx, lz, 0], [-lx, lz, Math.PI], [lx, -lz, Math.PI], [-lx, -lz, 0]];
  for (const d of legDefs) {
    const pv = new THREE.Group();
    pv.position.set(d[0], t.legH, d[1]);
    part(pv, t.legT, t.legH, t.legT, matBody, 0, -t.legH / 2, 0);
    g.add(pv);
    legs.push({ pv: pv, phase: d[2] });
  }

  // 목 + 머리
  const neckG = new THREE.Group();
  neckG.position.set(0, t.legH + t.bh * 0.82, t.len / 2 - 0.12);
  neckG.rotation.x = t.ang;
  g.add(neckG);
  const nw = Math.max(t.w * 0.5, 0.1);
  part(neckG, nw, t.neck, nw, matBody, 0, t.neck / 2, 0);
  const headG = new THREE.Group();
  headG.position.set(0, t.neck, 0);
  headG.rotation.x = -t.ang + 0.35;
  neckG.add(headG);
  const headMat = look === 'buffalo' ? matDark : matBody;
  part(headG, t.hw, t.hh, t.hl, headMat, 0, -t.hh * 0.1, t.hl * 0.35, 'head');
  if (look !== 'elephant') {
    part(headG, t.hw * 0.72, t.hh * 0.5, 0.06, matBlack, 0, -t.hh * 0.3, t.hl * 0.86, 'deco');
  }
  part(headG, es, es, es, matEye, t.hw / 2 + 0.005, t.hh * 0.12, t.hl * 0.5, 'deco');
  part(headG, es, es, es, matEye, -t.hw / 2 - 0.005, t.hh * 0.12, t.hl * 0.5, 'deco');

  // 꼬리
  const tailL = look === 'lion' ? t.bh * 1.1 : t.bh * 0.6;
  part(g, 0.05, tailL, 0.05, matDark, 0, t.legH + t.bh * 0.92 - tailL / 2, -t.len / 2 - 0.03, 'deco');

  // 종별 특징
  if (look === 'zebra') {
    for (let z = -t.len / 2 + 0.22; z <= t.len / 2 - 0.2; z += 0.22) {
      part(g, t.w + 0.03, t.bh + 0.03, 0.07, matDark, 0, bodyY, z, 'deco');
    }
    part(neckG, 0.07, t.neck, 0.07, matDark, 0, t.neck / 2, -nw / 2, 'deco');
    part(neckG, nw + 0.02, 0.06, nw + 0.02, matDark, 0, t.neck * 0.3, 0, 'deco');
    part(neckG, nw + 0.02, 0.06, nw + 0.02, matDark, 0, t.neck * 0.65, 0, 'deco');
    for (const s of [-1, 1]) part(headG, 0.05, 0.16, 0.05, matDark, s * t.hw * 0.35, t.hh * 0.55, t.hl * 0.05, 'deco');
  } else if (look === 'gazelle') {
    part(g, t.w + 0.02, 0.07, t.len * 0.75, matDark, 0, t.legH + t.bh * 0.4, 0, 'deco');
    for (const s of [-1, 1]) {
      const h = part(headG, 0.03, 0.34, 0.03, matDark, s * t.hw * 0.35, t.hh * 0.5 + 0.14, -0.02, 'deco');
      h.rotation.z = -s * 0.15;
      h.rotation.x = -0.25;
      part(headG, 0.05, 0.12, 0.05, matBody, s * t.hw * 0.55, t.hh * 0.45, t.hl * 0.05, 'deco');
    }
  } else if (look === 'buffalo') {
    part(g, t.w * 0.85, t.bh * 0.45, t.len * 0.32, matBody, 0, t.legH + t.bh + t.bh * 0.15, t.len * 0.2);
    for (const s of [-1, 1]) {
      part(headG, 0.42, 0.07, 0.07, matLight, s * (t.hw * 0.5 + 0.18), t.hh * 0.4, 0.05, 'deco');
      part(headG, 0.07, 0.24, 0.07, matLight, s * (t.hw * 0.5 + 0.38), t.hh * 0.4 + 0.11, 0.05, 'deco');
    }
  } else if (look === 'lion') {
    part(headG, t.hw * 1.75, t.hh * 1.75, t.hl * 0.6, matDark, 0, 0, 0, 'deco');
    part(g, 0.1, 0.13, 0.1, matDark, 0, t.legH + t.bh * 0.92 - tailL - 0.04, -t.len / 2 - 0.03, 'deco');
    for (const s of [-1, 1]) part(headG, 0.09, 0.09, 0.05, matBody, s * t.hw * 0.4, t.hh * 0.6, t.hl * 0.1, 'deco');
  } else if (look === 'elephant') {
    for (const s of [-1, 1]) {
      part(headG, 0.12, t.hh * 0.95, t.hw * 0.95, matDark, s * (t.hw / 2 + 0.06), 0, t.hl * 0.1, 'deco');
      part(headG, 0.08, 0.08, 0.6, matLight, s * t.hw * 0.3, -t.hh * 0.35, t.hl * 0.98, 'deco');
    }
    part(headG, 0.34, 0.5, 0.34, matBody, 0, -t.hh * 0.5, t.hl * 0.8);
    part(headG, 0.3, 0.5, 0.3, matBody, 0, -t.hh * 0.5 - 0.45, t.hl * 0.86);
    part(headG, 0.26, 0.4, 0.26, matBody, 0, -t.hh * 0.5 - 0.85, t.hl * 0.98);
  } else if (look === 'shade') {
    for (let z = -t.len / 2 + 0.2; z <= t.len / 2 - 0.15; z += 0.3) part(g, 0.06, 0.16, 0.12, matLight, 0, t.legH + t.bh + 0.07, z, 'deco');
    for (const s of [-1, 1]) part(headG, 0.07, 0.22, 0.07, matDark, s * t.hw * 0.35, t.hh * 0.6, t.hl * 0.05, 'deco');
  } else if (look === 'brute') {
    part(g, t.w * 0.85, t.bh * 0.4, t.len * 0.32, matBody, 0, t.legH + t.bh + t.bh * 0.12, t.len * 0.2);
    for (let z = -t.len / 2 + 0.25; z <= t.len / 2 - 0.2; z += 0.38) part(g, 0.1, 0.28, 0.16, matLight, 0, t.legH + t.bh + 0.2, z, 'deco');
    for (const s of [-1, 1]) {
      part(headG, 0.46, 0.09, 0.09, matLight, s * (t.hw * 0.5 + 0.2), t.hh * 0.45, 0.05, 'deco');
      part(headG, 0.09, 0.3, 0.09, matLight, s * (t.hw * 0.5 + 0.42), t.hh * 0.45 + 0.14, 0.05, 'deco');
    }
  } else if (look === 'hare') {
    for (const sx of [-1, 1]) { const e = part(headG, 0.04, 0.24, 0.05, matBody, sx * t.hw * 0.35, t.hh * 0.7, -t.hl * 0.05, 'deco'); e.rotation.x = -0.3; }
    part(g, 0.1, 0.1, 0.1, matLight, 0, t.legH + t.bh * 0.6, -t.len / 2 - 0.04, 'deco');
  } else if (look === 'deer') {
    for (const sx of [-1, 1]) {
      part(headG, 0.03, 0.34, 0.03, matDark, sx * t.hw * 0.3, t.hh * 0.75, -0.02, 'deco');
      const b1 = part(headG, 0.03, 0.18, 0.03, matDark, sx * (t.hw * 0.3 + 0.07), t.hh * 0.75 + 0.2, 0.02, 'deco'); b1.rotation.z = -sx * 0.6;
      const b2 = part(headG, 0.03, 0.14, 0.03, matDark, sx * (t.hw * 0.3 + 0.05), t.hh * 0.75 + 0.08, 0.06, 'deco'); b2.rotation.z = -sx * 0.6;
    }
    part(g, 0.12, 0.12, 0.1, matLight, 0, t.legH + t.bh * 0.85, -t.len / 2 - 0.05, 'deco');
  } else if (look === 'wolf') {
    for (const sx of [-1, 1]) part(headG, 0.07, 0.2, 0.07, matDark, sx * t.hw * 0.35, t.hh * 0.62, t.hl * 0.05, 'deco');
    part(g, 0.13, 0.13, 0.42, matBody, 0, t.legH + t.bh * 0.88, -t.len / 2 - 0.2, 'deco');
    part(g, 0.14, 0.14, 0.12, matLight, 0, t.legH + t.bh * 0.88, -t.len / 2 - 0.42, 'deco');
  } else if (look === 'bear') {
    part(g, t.w * 0.8, t.bh * 0.35, t.len * 0.3, matBody, 0, t.legH + t.bh + t.bh * 0.1, t.len * 0.18);
    for (const sx of [-1, 1]) part(headG, 0.16, 0.16, 0.08, matBody, sx * t.hw * 0.38, t.hh * 0.6, t.hl * 0.05, 'deco');
    part(headG, t.hw * 0.5, t.hh * 0.4, 0.1, matDark, 0, -t.hh * 0.25, t.hl * 0.88, 'deco');
  } else if (look === 'monkey') {
    for (const sx of [-1, 1]) part(headG, 0.08, 0.1, 0.04, matLight, sx * (t.hw / 2 + 0.04), 0, t.hl * 0.2, 'deco');
    for (let i = 0; i < 4; i++) part(g, 0.05, 0.05, 0.16, matBody, 0, t.legH + t.bh * 0.8 + i * 0.05, -t.len / 2 - 0.1 - i * 0.14, 'deco');
  } else if (look === 'boar') {
    for (const sx of [-1, 1]) { const tk = part(headG, 0.04, 0.04, 0.2, matLight, sx * t.hw * 0.35, -t.hh * 0.25, t.hl * 0.92, 'deco'); tk.rotation.x = -0.4; }
    for (let z = -t.len / 2 + 0.15; z <= t.len / 2 - 0.1; z += 0.22) part(g, 0.05, 0.12, 0.08, matDark, 0, t.legH + t.bh + 0.05, z, 'deco');
  } else if (look === 'panther') {
    for (const sx of [-1, 1]) part(headG, 0.07, 0.09, 0.05, matBody, sx * t.hw * 0.38, t.hh * 0.6, t.hl * 0.1, 'deco');
    part(g, 0.06, 0.06, 0.8, matDark, 0, t.legH + t.bh * 0.8, -t.len / 2 - 0.4, 'deco');
  } else if (look === 'croc') {
    for (let z = -t.len / 2 + 0.3; z <= t.len / 2 - 0.3; z += 0.4) part(g, 0.1, 0.12, 0.14, matDark, 0, t.legH + t.bh + 0.05, z, 'deco');
    part(g, t.w * 0.55, t.bh * 0.7, t.len * 0.45, matBody, 0, t.legH + t.bh * 0.4, -t.len / 2 - t.len * 0.18, 'deco');
    part(g, t.w * 0.3, t.bh * 0.4, t.len * 0.3, matBody, 0, t.legH + t.bh * 0.3, -t.len / 2 - t.len * 0.48, 'deco');
    for (const sx of [-1, 1]) for (let i = 0; i < 4; i++) part(headG, 0.04, 0.06, 0.05, matLight, sx * t.hw * 0.45, -t.hh * 0.5, t.hl * (0.4 + i * 0.15), 'deco');
  } else if (look === 'goat') {
    for (const sx of [-1, 1]) { const h = part(headG, 0.04, 0.26, 0.04, matLight, sx * t.hw * 0.35, t.hh * 0.6, -0.02, 'deco'); h.rotation.x = 0.7; }
    part(headG, 0.05, 0.14, 0.05, matLight, 0, -t.hh * 0.5, t.hl * 0.8, 'deco');
  } else if (look === 'lizard') {
    for (let z = -t.len / 2 + 0.2; z <= t.len / 2 - 0.1; z += 0.28) part(g, 0.06, 0.16, 0.1, matLight, 0, t.legH + t.bh + 0.06, z, 'deco');
    part(g, t.w * 0.5, t.bh * 0.6, t.len * 0.45, matBody, 0, t.legH + t.bh * 0.5, -t.len / 2 - t.len * 0.2, 'deco');
    part(g, t.w * 0.28, t.bh * 0.4, t.len * 0.35, matBody, 0, t.legH + t.bh * 0.4, -t.len / 2 - t.len * 0.5, 'deco');
  } else if (look === 'golem') {
    for (const sx of [-1, 1]) {
      part(g, 0.6, 0.6, 0.9, matBody, sx * (t.w / 2 + 0.2), t.legH + t.bh * 0.95, t.len * 0.2, 'deco');
      part(g, 0.3, 0.9, 0.3, matBody, sx * (t.w / 2 + 0.25), t.legH + t.bh * 0.35, t.len * 0.2);
    }
    for (let i = 0; i < 3; i++) part(g, t.w + 0.04, 0.07, 0.07, matEye, 0, t.legH + t.bh * (0.25 + i * 0.25), t.len * 0.2 - i * 0.4, 'deco');
  } else if (look === 'gorilla') {
    for (const sx of [-1, 1]) part(g, 0.28, t.legH * 1.1, 0.28, matBody, sx * (t.w / 2 + 0.2), t.legH * 0.5 + 0.1, t.len * 0.25);
    part(headG, t.hw * 0.6, t.hh * 0.5, 0.1, matDark, 0, -t.hh * 0.2, t.hl * 0.85, 'deco');
  }

  if (t.boss || t.tboss) {
    for (const sx of [-1, 0, 1]) part(headG, 0.07, sx === 0 ? 0.5 : 0.36, 0.07, matEye, sx * t.hw * 0.32, t.hh * 0.68, t.hl * 0.05, 'deco');
  }

    _e2.set(src.g.position.x, src.g.position.y + src.t.legH + src.t.bh * 0.5, src.g.position.z);

}

function sweepHit(W, skip) {
  const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
  for (const a of animals) {
    if (a === skip || a.dead || a.vanishing) continue;
    const dx = a.g.position.x - player.pos.x, dz = a.g.position.z - player.pos.z;
    const d = Math.hypot(dx, dz);
    if (d - a.t.radius > W.range) continue;
    if (d > a.t.radius && (dx * fx + dz * fz) / (d || 1) < 0.45) continue;
    _bv.set(a.g.position.x, a.g.position.y + a.t.legH + a.t.bh * 0.5, a.g.position.z);
    hitAnimal(a, false, _bv, W.dmg * 0.7, '휩쓸기 ');
    applyEffects(a, W);
  }
}

function doMelee(W) {
  if (player.cool > 0) return;
  player.cool = W.cd;
  player.swing = W.swing;
  sfx('swing');
  const r = aimTest(W.range);
  let primary = null;
  if (r.hit === 'animal' && r.animal && r.dist <= W.range) {
    const a = r.animal;
    primary = a;
    // 눈치채지 못한 동물을 노리면 기습
    const unaware = a.fear <= 0 && !a.aggro && a.state !== 'chase' && a.state !== 'flee';
    const base = W.dmg * (r.head ? W.head : 1) * (unaware ? W.sneak : 1);
    hitAnimal(a, r.head, r.point, base, unaware ? '기습 ' : (r.head ? '헤드샷 ' : ''));
    if (W.stun && !a.dead) a.stun = W.stun * ((a.t.boss || a.t.tboss) ? 0.5 : 1);
    applyEffects(a, W);
    if (W.chain) chainHit(a, W);
  } else if (r.hit === 'world' && r.dist <= W.range) {
    burst(r.point, 'dust', 4);
  }
  if (W.sweep) sweepHit(W, primary);
}

function addAgg(agg, a, head, pt, W) {
  let e = agg.get(a);
  if (!e) { e = { base: 0, head: false, pt: pt.clone() }; agg.set(a, e); }
  e.base += W.dmg * (head ? W.head : 1);
  if (head) e.head = true;
}

function doGun(id, W) {
  const sl = curSlot();
  if (!sl || player.cool > 0 || player.reloading) return;
  if (sl.mag <= 0) {
    player.cool = 0.3;
    if (player.reserve > 0) startReload(); else { say('탄약이 없습니다'); sfx('empty'); }
    return;
  }
  sl.mag -= 1;
  player.cool = W.cd;
  player.kick += W.kick;
  gunAnim.recoil = 1; gunAnim.flash = 0.05;
  sfx(W.quiet ? 'swing' : 'shot');
  if (!W.quiet) alarmAnimals();
  const V = VIEW[id];
  if (V.flash) V.flash.getWorldPosition(_m); else _m.copy(camera.position);
  const agg = new Map();
  for (let i = 0; i < W.pellets; i++) {
    const r = aimTest(W.range, W.spread);
    const len = r.hit === 'none' ? Math.min(W.range, 120) : r.dist;
    _e.copy(_o).addScaledVector(_d, len);
    addTracer(_m, _e, W.tracer);
    if (r.hit === 'animal' && r.animal) {
      addAgg(agg, r.animal, r.head, r.point, W);
      if (W.pierce) {
        const blockD = r.block;
        const hits = ray.intersectObjects(liveTargets(), false);
        const seen = new Set([r.animal]);
        for (const h of hits) {
          const a2 = h.object.userData.animal;
          if (!a2 || seen.has(a2) || seen.size >= W.pierce || h.distance > blockD) continue;
          seen.add(a2);
          addAgg(agg, a2, h.object.userData.part === 'head', h.point, W);
        }
      }
    } else if (r.hit === 'world' && i < 3) {
      burst(r.point, 'dust', 4);
    }
  }
  let first = null;
  agg.forEach(function (e, a) {
    hitAnimal(a, e.head, e.pt, e.base);
    if (!first) first = a;
    applyEffects(a, W);
  });
  if (W.chain && first) chainHit(first, W);
  if (sl.mag === 0 && player.reserve > 0) startReload();
}

function doShoot() {
  if (state.mode !== 'play' || player.dead) return;
  const id = curId(), W = WEAPONS[id];
  if (W.kind === 'melee') doMelee(W); else doGun(id, W);
}

const POTIONS = {

const ITEM_CAP = 9;
const bombs = [], explosions = [];
const _bv = new THREE.Vector3();
const bombGeo = new THREE.SphereGeometry(0.14, 10, 8);
const bombMat = new THREE.MeshLambertMaterial({ color: 0x222226 });
const bombCapGeo = new THREE.SphereGeometry(0.055, 8, 6);
const bombCapMat = new THREE.MeshBasicMaterial({ color: 0xff5522 });

const BOMB_RADIUS = 7.5;

function addItem(id, n) {

function throwBomb() {

function updateBombs(dt) {
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i], p = b.m.position;
    b.fuse -= dt;
    b.vy -= 22 * dt;
    p.x += b.vx * dt; p.y += b.vy * dt; p.z += b.vz * dt;
    p.x = clamp(p.x, -HALF + 2, HALF - 2); p.z = clamp(p.z, -HALF + 2, HALF - 2);
    const gh = heightAt(p.x, p.z) + 0.14;
    if (p.y < gh) {
      p.y = gh;
      if (b.vy < -2) b.vy = -b.vy * 0.35; else b.vy = 0;
      const fr = Math.exp(-dt * 6);
      b.vx *= fr; b.vz *= fr;
    }
    for (const o of obstacles) {
      const ox = p.x - o.x, oz = p.z - o.z, mm = o.r + 0.15, d2 = ox * ox + oz * oz;
      if (d2 < mm * mm && d2 > 1e-6) {
        const d = Math.sqrt(d2);
        p.x = o.x + (ox / d) * mm; p.z = o.z + (oz / d) * mm;
        b.vx *= -0.4; b.vz *= -0.4;
      }
    }
    b.cap.visible = b.fuse < 0.5 || (Math.floor(b.fuse * 8) % 2 === 0);
    if (b.fuse <= 0) {
      explode(p);
      scene.remove(b.m);
      bombs.splice(i, 1);
    }
  }
}

function explode(pos) {
  _bv.copy(pos);
  const cx = _bv.x, cy = _bv.y, cz = _bv.z;
  const mat = new THREE.MeshBasicMaterial({ color: 0xffa030, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  const mesh = new THREE.Mesh(boomGeo, mat);
  mesh.position.set(cx, cy, cz);
  mesh.scale.setScalar(0.5);
  scene.add(mesh);
  explosions.push({ mesh: mesh, mat: mat, t: 0 });
  burst(_bv, 'dust', 14);
  burst(_bv, 'hit', 8);
  sfx('boom');
  const pd = Math.hypot(player.pos.x - cx, player.pos.y + 1 - cy, player.pos.z - cz);
  player.shake = Math.max(player.shake, clamp(1 - pd / 30, 0, 1));
  for (const a of animals) {
    if (a.t.aggro === 'none' && !a.dead && Math.hypot(a.g.position.x - cx, a.g.position.z - cz) < 70) a.fear = Math.max(a.fear, 5);
  }
  for (const a of animals) {
    if (a.dead || a.vanishing) continue;
    const ax = a.g.position.x, ay = a.g.position.y + a.t.legH + a.t.bh * 0.5, az = a.g.position.z;
    const d = Math.hypot(ax - cx, ay - cy, az - cz) - a.t.radius * 0.6;

    const f = clamp(1 - Math.max(0, d) / BOMB_RADIUS, 0.25, 1);
    _bv.set(ax, ay, az);
    hitAnimal(a, false, _bv, 150 * f, '폭발 ');
  }

function updateExplosions(dt) {

    if (k >= 1) { scene.remove(x.mesh); x.mat.dispose(); explosions.splice(i, 1); continue; }
    x.mesh.scale.setScalar(0.5 + k * BOMB_RADIUS * 0.9);
    x.mat.opacity = 0.85 * (1 - k);

}

/* ================= 플레이어 갱신 ================= */
const SENS = 0.0022;
function look(dx, dy) {
  const k = camera.fov / BASE_FOV;
  dx = clamp(dx, -150, 150); dy = clamp(dy, -150, 150);
  player.yaw -= dx * SENS * k;
  player.pitch = clamp(player.pitch - dy * SENS * k, -1.45, 1.45);
}

function syncCamera() {
  const shk = player.shake > 0 ? player.shake * 0.25 : 0;
  camera.position.set(player.pos.x + (shk ? rand(-shk, shk) : 0), player.pos.y + EYE + player.bobY + (shk ? rand(-shk, shk) : 0), player.pos.z + (shk ? rand(-shk, shk) : 0));
  camera.rotation.set(clamp(player.pitch + player.kick, -1.5, 1.5), player.yaw, 0);
}

function updatePlayer(dt) {
  if (sleep.on) { updateSleep(dt); player.safe = true; syncCamera(); return; }
  let f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + input.joyF;
  let s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + input.joyS;
  const len = Math.hypot(f, s);
  if (len > 1) { f /= len; s /= len; }
  const sprint = (keys.ShiftLeft || keys.ShiftRight || input.sprint) && f > 0;
  const speed = (sprint ? 9.5 : 5.6) * (player.fx.speed > 0 ? 1.45 : 1) * (player.art.boots ? 1.12 : 1);
  const sn = Math.sin(player.yaw), cs = Math.cos(player.yaw);
  let nx = player.pos.x + (-sn * f + cs * s) * speed * dt;
  let nz = player.pos.z + (-cs * f - sn * s) * speed * dt;

  for (const o of obstacles) {
    const ox = nx - o.x, oz = nz - o.z, m = o.r + 0.45, d2 = ox * ox + oz * oz;
    if (d2 < m * m && d2 > 1e-6) { const d = Math.sqrt(d2); nx = o.x + (ox / d) * m; nz = o.z + (oz / d) * m; }
  }
  for (const a of animals) {
    if (a.dead || a.vanishing) continue;
    const ox = nx - a.g.position.x, oz = nz - a.g.position.z, m = a.t.radius * 0.7 + 0.45, d2 = ox * ox + oz * oz;
    if (d2 < m * m && d2 > 1e-6) { const d = Math.sqrt(d2); nx = a.g.position.x + (ox / d) * m; nz = a.g.position.z + (oz / d) * m; }
  }
  player.pos.x = clamp(nx, -HALF + 4, HALF - 4);
  player.pos.z = clamp(nz, -HALF + 4, HALF - 4);
  player.safe = inTent(player.pos.x, player.pos.z);
  {
    const PZ = zoneProps[zone];
    if (PZ && PZ.hazards.length && player.pos.y - heightAt(player.pos.x, player.pos.z) < 0.6) {
      for (const hz of PZ.hazards) { if (Math.hypot(player.pos.x - hz.x, player.pos.z - hz.z) < hz.r) { lavaBurn(dt); break; } }
    }
  }

  const ground = heightAt(player.pos.x, player.pos.z);
  if (player.wantJump && player.onGround) { player.vy = 7.5; player.onGround = false; }
  player.wantJump = false;
  if (!player.onGround) {
    player.vy -= 22 * dt;
    player.pos.y += player.vy * dt;
    if (player.pos.y <= ground) { player.pos.y = ground; player.vy = 0; player.onGround = true; }
  } else {
    player.pos.y = ground;
  }

  const moving = len > 0.05 && player.onGround;
  if (moving) player.bob += dt * (sprint ? 13 : 9);
  player.bobY = moving ? Math.sin(player.bob) * 0.04 : 0;

  player.cool = Math.max(0, player.cool - dt);
  player.bombCool = Math.max(0, player.bombCool - dt);
  player.shake = Math.max(0, player.shake - dt * 2.5);
  for (const k of Object.keys(player.fx)) { if (player.fx[k] > 0) player.fx[k] = Math.max(0, player.fx[k] - dt); }
  player.kick *= Math.exp(-dt * 10);
  player.hurtT = Math.max(0, player.hurtT - dt);
  player.sinceHurt += dt;
  if (player.sinceHurt > 6 && player.hp < player.maxHp) player.hp = Math.min(player.maxHp, player.hp + 2 * dt);

  if (input.fire) shoot();

  const id = curId(), W = WEAPONS[id], slot = curSlot();
  if (player.reloading) {
    player.reloadT += dt;
    if (!slot || W.kind !== 'gun') player.reloading = false;
    else if (player.reloadT >= W.reload) {
      const n = Math.min(W.mag - slot.mag, player.reserve);
      slot.mag += n; player.reserve -= n; player.reloading = false;
    }
  }

  const tf = (input.zoom && W.zoom) ? 30 : BASE_FOV;
  if (Math.abs(camera.fov - tf) > 0.05) {
    camera.fov += (tf - camera.fov) * Math.min(1, dt * 12);
    camera.updateProjectionMatrix();
  }

  gunAnim.recoil = Math.max(0, gunAnim.recoil - dt * 7);
  gunAnim.flash -= dt;
  player.swing = Math.max(0, player.swing - dt);
  for (const k of Object.keys(VIEW)) { if (VIEW[k].flash) VIEW[k].flash.visible = (k === id) && gunAnim.flash > 0; }
  const V = VIEW[id], vb = V.base;
  if (W.kind === 'gun') {
    const ty = (input.zoom && W.zoom) ? -0.6 : (player.reloading ? vb[1] - 0.16 : vb[1]);
    V.g.position.x = vb[0];
    V.g.position.y += (ty - V.g.position.y) * Math.min(1, dt * 10);
    V.g.position.z = vb[2] + gunAnim.recoil * 0.09;
    V.g.rotation.set(vb[3] + gunAnim.recoil * 0.1 + (player.reloading ? -0.35 : 0), vb[4], vb[5]);
  } else {
    const sw = player.swing > 0 ? Math.sin((1 - player.swing / W.swing) * Math.PI) : 0;
    const sv = V.swing;
    V.g.position.set(vb[0] + sw * sv[0], vb[1] + sw * sv[1], vb[2] + sw * sv[2]);
    V.g.rotation.set(vb[3] + sw * sv[3], vb[4] + sw * sv[4], vb[5] + sw * sv[5]);
  }

  syncCamera();
}

function updateWorld(dt, live) {
  if (world.day > 0.5) {
    for (const a of animals) {
      if (isNightMonster(a) && !a.dead && !a.vanishing) { a.vanishing = true; a.vt = 0; removeLabel(a); }
    }
  }
  if (live) spawnMonsters(dt);
  if (live) updateTemple();
  for (let i = animals.length - 1; i >= 0; i--) {
    const a = animals[i];
    updateAnimal(a, dt, live);
    if (a.gone || (a.dead && a.deadT > (a.t.monster ? 4.5 : 9.2))) { disposeAnimal(a); animals.splice(i, 1); }
  }
  for (let i = respawnQ.length - 1; i >= 0; i--) {
    respawnQ[i].t -= dt;
    if (respawnQ[i].t <= 0) {
      const q = respawnQ.splice(i, 1)[0];
      spawnAnimal(q.key, TYPES[q.key].aggro === 'always' ? 70 : 45);
    }
  }
}

function updateClock() {

  const dx = tent.x - player.pos.x, dz = tent.z - player.pos.z;
  const rel = angleDiff(player.yaw, Math.atan2(-dx, -dz));
  const deg = Math.round((-rel * 180) / Math.PI);

  setText('tentDist', el.tentDist, player.safe ? '텐트 안' : '텐트 ' + Math.round(Math.hypot(dx, dz)) + 'm');

function updateInteract() {
  const box = sleep.on ? null : nearestBox(3.2);
  const portalNear = !box && !sleep.on && nearPortal();
  const canSleep = player.safe && world.q > 0.55 && !sleep.on;
  const mode = box ? 'box' : (portalNear ? 'portal' : (canSleep ? 'sleep' : ''));
  if (cache.useMode !== mode) {
    cache.useMode = mode;
    el.prompt.textContent = mode === 'box' ? PROMPT_BOX : (mode === 'portal' ? PROMPT_PORTAL : (mode === 'sleep' ? PROMPT_SLEEP : ''));

function updateLabels() {
  const W = window.innerWidth, H = window.innerHeight;
  const show = state.mode === 'play';
  for (const a of animals) {
    const L = a.label;
    if (!L) continue;
    let vis = false, x = 0, y = 0, op = 1;
    if (show && !a.dead) {
      _v.set(a.g.position.x, a.g.position.y + a.t.tagH, a.g.position.z);
      const dist = _v.distanceTo(camera.position);
      _v.project(camera);
      if (_v.z < 1 && _v.z > -1 && Math.abs(_v.x) < 1.1 && Math.abs(_v.y) < 1.1 && dist < 85) {
        vis = true;
        x = (_v.x * 0.5 + 0.5) * W; y = (-_v.y * 0.5 + 0.5) * H;
        op = clamp(1.25 - dist / 90, 0.3, 1);
      }
    }
    if (vis !== L.vis) { L.vis = vis; L.el.style.display = vis ? 'flex' : 'none'; }
    if (!vis) continue;
    L.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-50%,-100%)';
    L.el.style.opacity = op.toFixed(2);
    if (L.hp !== a.hp) {
      L.hp = a.hp;
      L.hpn.textContent = String(Math.ceil(a.hp));
      const rr = a.hp / a.maxHp;
      L.fill.style.width = (rr * 100).toFixed(1) + '%';
      L.fill.style.background = hpColor(rr);
    }
  }
}

function requestLock() {
  if (isTouch) return;
  try {
    if (!el.canvas.requestPointerLock) { state.lockMode = 'drag'; return; }
    const p = el.canvas.requestPointerLock();
    if (p && typeof p.catch === 'function') p.catch(function () { if (!state.everLocked) state.lockMode = 'drag'; });
  } catch (e) { if (!state.everLocked) state.lockMode = 'drag'; }
}
function releaseLock() {
  try { if (document.pointerLockElement) document.exitPointerLock(); } catch (e) {}
}

function resetInput() {
  for (const k of Object.keys(keys)) keys[k] = false;
  input.fire = false; input.zoom = false; input.joyF = 0; input.joyS = 0; input.sprint = false;
  drag.active = false;
}

function resetGame() {

  animals.length = 0;
  respawnQ.length = 0;
  clearFX();
  player.pos.set(0, heightAt(0, 0), 0);
  player.vy = 0; player.onGround = true; player.yaw = 0; player.pitch = 0; player.kick = 0;
  player.maxHp = 100; player.art = {}; player.legends = {};
  player.hp = player.maxHp; player.hurtT = 0; player.sinceHurt = 99; player.dead = false; player.killer = '';
  player.items = { heal: 0, speed: 0, power: 0, shield: 0, vision: 0, bomb: 0 };
  player.fx = { speed: 0, power: 0, shield: 0, vision: 0 }; player.bombCool = 0; player.shake = 0;
  player.slots = []; player.cur = -1; player.reserve = AMMO_START; player.cool = 0; player.reloading = false; player.reloadT = 0; player.swing = 0;
  pendingSlot = null; el.swap.hidden = true;

  resetInput();
  releaseLock();
  el.hurt.style.opacity = '0'; cache.hurt = 0;
  showOverlay('over');
}

el.btnStart.addEventListener('click', function () {
  if (state.mode === 'pause') resumeGame(); else startNew();
});

/* ================= 입력: 키보드 / 마우스 ================= */
window.addEventListener('keydown', function (e) {
  if (state.mode === 'play' && (e.code === 'Space' || e.code.indexOf('Arrow') === 0)) e.preventDefault();
  keys[e.code] = true;
  if (state.mode === 'swap') {
    if (!e.repeat) {
      const dm = /^Digit([1-9])$/.exec(e.code);
      if (dm && choice && Number(dm[1]) - 1 < choice.length) resolveChoice(Number(dm[1]) - 1);
      else if (e.code === 'Escape' && choice) resolveChoice(choice.length - 1);
    }
    return;
  }
  if (state.mode !== 'play') return;
  if (e.code === 'Space' && !e.repeat) player.wantJump = true;
  else if (e.code === 'KeyR') startReload();
  else if (e.code === 'KeyF' && !e.repeat) shoot();
  else if (e.code === 'KeyE' && !e.repeat) interact();
  else if (e.code === 'Digit0' && !e.repeat) setWeapon(-1);
  else if (e.code === 'Digit1' && !e.repeat) setWeapon(0);
  else if (e.code === 'Digit2' && !e.repeat) setWeapon(1);
  else if (e.code === 'Digit3' && !e.repeat) setWeapon(2);
  else if (e.code === 'KeyQ' && !e.repeat) cycleWeapon(1);
  else if (e.code === 'Digit4' && !e.repeat) useItem('heal');
  else if (e.code === 'Digit5' && !e.repeat) useItem('speed');
  else if (e.code === 'Digit6' && !e.repeat) useItem('power');
  else if (e.code === 'Digit7' && !e.repeat) useItem('shield');
  else if (e.code === 'Digit8' && !e.repeat) useItem('vision');
  else if ((e.code === 'KeyG' || e.code === 'Digit9') && !e.repeat) useItem('bomb');
  else if (e.code === 'Escape' && state.lockMode === 'drag') pauseGame();
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; });
window.addEventListener('blur', function () { for (const k of Object.keys(keys)) keys[k] = false; input.fire = false; });
document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame(); });

document.addEventListener('pointerlockchange', function () {
  if (document.pointerLockElement === el.canvas) { state.lockMode = 'pointer'; state.everLocked = true; }
  else if (state.mode === 'play' && state.lockMode === 'pointer') pauseGame();
});
document.addEventListener('pointerlockerror', function () { if (!state.everLocked) state.lockMode = 'drag'; });

document.addEventListener('mousemove', function (e) {
  if (state.mode !== 'play' || isTouch) return;
  if (document.pointerLockElement === el.canvas) {
    look(e.movementX || 0, e.movementY || 0);
  } else if (state.lockMode === 'drag' && drag.active) {
    const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
    drag.lx = e.clientX; drag.ly = e.clientY;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    look(dx, dy);
  }
});
document.addEventListener('mousedown', function (e) {
  if (state.mode !== 'play' || isTouch) return;
  if (e.target && e.target.closest && e.target.closest('#items')) return;
  if (e.button === 2) { input.zoom = true; return; }
  if (e.button !== 0) return;
  if (state.lockMode === 'pointer') {
    if (document.pointerLockElement !== el.canvas) { requestLock(); return; }
    input.fire = true;
    shoot();
  } else {
    drag.active = true; drag.lx = e.clientX; drag.ly = e.clientY; drag.moved = 0; drag.t = performance.now();
  }
});
document.addEventListener('mouseup', function (e) {
  if (e.button === 2) input.zoom = false;
  if (e.button !== 0) return;
  input.fire = false;
  if (drag.active) {
    drag.active = false;
    if (state.mode === 'play' && state.lockMode === 'drag' && drag.moved < 8 && performance.now() - drag.t < 400) shoot();
  }
});
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
let wheelAt = 0;
document.addEventListener('wheel', function (e) {
  if (state.mode !== 'play' || isTouch) return;
  const now = performance.now();
  if (now - wheelAt < 250) return;
  wheelAt = now;
  cycleWeapon(e.deltaY < 0 ? -1 : 1);
}, { passive: true });

/* ================= 입력: 터치 ================= */
const tState = { move: null, look: null };
function placeStick(x, y) {
  el.stick.style.left = (x - 60) + 'px'; el.stick.style.top = (y - 60) + 'px'; el.stick.style.bottom = 'auto'; el.stick.style.opacity = '0.9';
}
function resetStick() {
  el.stick.style.left = ''; el.stick.style.top = ''; el.stick.style.bottom = ''; el.stick.style.opacity = '';
  el.knob.style.transform = '';
}
document.addEventListener('touchstart', function (e) {
  if (state.mode !== 'play') return;
  for (const t of e.changedTouches) {
    if (t.target && t.target.classList && t.target.classList.contains('tbtn')) continue;
    if (t.clientX < window.innerWidth * 0.42 && !tState.move) {
      tState.move = { id: t.identifier, sx: t.clientX, sy: t.clientY };
      placeStick(t.clientX, t.clientY);
    } else if (!tState.look) {
      tState.look = { id: t.identifier, lx: t.clientX, ly: t.clientY, moved: 0, t0: performance.now() };
    }
  }
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', function (e) {
  if (state.mode !== 'play') return;
  for (const t of e.changedTouches) {
    if (tState.move && t.identifier === tState.move.id) {
      const dx = t.clientX - tState.move.sx, dy = t.clientY - tState.move.sy, R = 55;
      const m = Math.min(1, Math.hypot(dx, dy) / R), ang = Math.atan2(dy, dx);
      input.joyS = Math.cos(ang) * m; input.joyF = -Math.sin(ang) * m; input.sprint = m > 0.95;
      el.knob.style.transform = 'translate(' + (Math.cos(ang) * m * R).toFixed(1) + 'px,' + (Math.sin(ang) * m * R).toFixed(1) + 'px)';
    } else if (tState.look && t.identifier === tState.look.id) {
      const dx = t.clientX - tState.look.lx, dy = t.clientY - tState.look.ly;
      tState.look.lx = t.clientX; tState.look.ly = t.clientY; tState.look.moved += Math.abs(dx) + Math.abs(dy);
      look(dx * 1.7, dy * 1.7);
    }
  }
  e.preventDefault();
}, { passive: false });
function touchEnd(e) {
  for (const t of e.changedTouches) {
    if (tState.move && t.identifier === tState.move.id) {
      tState.move = null; input.joyF = 0; input.joyS = 0; input.sprint = false; resetStick();
    } else if (tState.look && t.identifier === tState.look.id) {
      const L = tState.look; tState.look = null;
      if (e.type === 'touchend' && state.mode === 'play' && L.moved < 10 && performance.now() - L.t0 < 260) shoot();
    }
  }
}
document.addEventListener('touchend', touchEnd);
document.addEventListener('touchcancel', touchEnd);

function bindBtn(node, down, up) {
  node.addEventListener('touchstart', function (e) { e.preventDefault(); e.stopPropagation(); down(); }, { passive: false });
  const end = function (e) { e.preventDefault(); e.stopPropagation(); if (up) up(); };
  node.addEventListener('touchend', end, { passive: false });
  node.addEventListener('touchcancel', end, { passive: false });
}
bindBtn(el.tFire, function () { input.fire = true; shoot(); }, function () { input.fire = false; });
bindBtn(el.tReload, function () { startReload(); }, null);
bindBtn(el.tJump, function () { player.wantJump = true; }, null);
bindBtn(el.tZoom, function () { input.zoom = !input.zoom; }, null);
bindBtn(el.tSleep, function () { interact(); }, null);
bindBtn(el.tWeapon, function () { cycleWeapon(1); }, null);

/* ================= 크기 조정 / 메인 루프 ================= */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

function menuCamera(dt) {
  player.yaw += dt * 0.08;
  player.pitch = -0.04;
  player.kick = 0; player.bobY = 0; player.shake = 0;
  player.pos.y = heightAt(player.pos.x, player.pos.z);
  for (const k of Object.keys(VIEW)) { if (VIEW[k].flash) VIEW[k].flash.visible = false; }
  syncCamera();
}

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  try {
    const dt = Math.min(0.05, Math.max(0.0001, (now - last) / 1000));
    last = now;
    if (state.mode === 'play') { tickWorld(dt); updatePlayer(dt); updateWorld(dt, true); updateFX(dt); }
    else if (state.mode === 'menu' || state.mode === 'over') { menuCamera(dt); updateWorld(dt, false); updateFX(dt); }
    applyTime(now);
    updateBoxes(dt, now);
    updateWeather(dt, now);
    renderer.render(scene, camera);
    updateLabels();
    updateTarget();
    if (state.mode === 'play') updateHud(now);
  } catch (err) {
    console.error(err);
  }
}

/* ================= 시작 ================= */
buildInfo();
el.itemEls = {};
for (const d of ITEM_DEFS) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'item';
  btn.style.borderLeftColor = d.color;
  const label = document.createElement('span');
  const count = document.createElement('b');
  btn.appendChild(label); btn.appendChild(count);
  btn.addEventListener('click', function () { useItem(d.id); });
  btn.addEventListener('touchstart', function (e) { e.preventDefault(); e.stopPropagation(); useItem(d.id); }, { passive: false });
  el.items.appendChild(btn);
  el.itemEls[d.id] = { btn: btn, label: label, count: count };
}
el.fxEls = {};
for (const k of Object.keys(FX_NAMES)) {
  const tg = document.createElement('div');
  tg.className = 'fxtag';
  el.fx.appendChild(tg);
  el.fxEls[k] = tg;
}
el.artEls = {};
for (const k of Object.keys(ARTIFACTS)) { const tg = document.createElement('div'); tg.className = 'fxtag art'; el.fx.appendChild(tg); el.artEls[k] = tg; }
el.chips = [];
for (let ci = 0; ci < 4; ci++) { const c = document.createElement('div'); c.className = 'chip'; el.slots.appendChild(c); el.chips.push(c); }
player.pos.set(0, heightAt(0, 0), 0);
resetZones();
spawnInitial();
spawnInitialBoxes();
refreshView();
syncCamera();
showOverlay('menu');
window.addEventListener('load', onResize);
requestAnimationFrame(loop);

})();
</script>
</body>
</html>

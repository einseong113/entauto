<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>팩맨</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    font-family: 'Courier New', monospace;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100%;
    width: 100%;
    padding-top: env(safe-area-inset-top, 8px);
  }
  #hud {
    color: #ffe000;
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    padding: 6px 12px;
    font-size: 16px;
    letter-spacing: 1px;
  }
  #hud span.label { color: #6ab0ff; }
  #gameCanvasWrap {
    width: 100%;
    max-width: 420px;
    flex: 0 1 auto;
    display: flex;
    justify-content: center;
  }
  canvas {
    background: #000;
    width: 100%;
    max-width: 420px;
    height: auto;
    display: block;
    image-rendering: pixelated;
  }
  #msgOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffe000;
    text-align: center;
    z-index: 10;
    padding: 20px;
  }
  #msgOverlay h1 {
    font-size: 28px;
    margin: 0 0 8px;
    letter-spacing: 2px;
  }
  #msgOverlay p {
    color: #eee;
    font-size: 14px;
    margin: 4px 0;
  }
  #startBtn {
    margin-top: 16px;
    background: #ffe000;
    color: #000;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 6px;
    font-family: inherit;
  }
  #startBtn:active { background: #cfb300; }
  .hidden { display: none !important; }

  #controls {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 max(10px, env(safe-area-inset-bottom));
    flex: 1;
    justify-content: center;
    gap: 6px;
  }
  .dpad-row { display: flex; gap: 6px; }
  .dpad-btn {
    width: 64px; height: 64px;
    background: #1a1a3a;
    border: 2px solid #3a3aff;
    border-radius: 12px;
    color: #ffe000;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dpad-btn:active { background: #3a3aff; }
  .dpad-spacer { width: 64px; height: 64px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span><span class="label">SCORE</span> <span id="scoreVal">0</span></span>
    <span><span class="label">LIVES</span> <span id="livesVal">●●●</span></span>
  </div>
  <div id="gameCanvasWrap">
    <canvas id="game"></canvas>
  </div>
  <div id="controls">
    <div class="dpad-row">
      <div class="dpad-spacer"></div>
      <div class="dpad-btn" id="btnUp">▲</div>
      <div class="dpad-spacer"></div>
    </div>
    <div class="dpad-row">
      <div class="dpad-btn" id="btnLeft">◀</div>
      <div class="dpad-spacer"></div>
      <div class="dpad-btn" id="btnRight">▶</div>
    </div>
    <div class="dpad-row">
      <div class="dpad-spacer"></div>
      <div class="dpad-btn" id="btnDown">▼</div>
      <div class="dpad-spacer"></div>
    </div>
  </div>
</div>

<div id="msgOverlay">
  <h1 id="msgTitle">PAC-MAN</h1>
  <p id="msgSub">화면을 스와이프하거나 아래 방향키를 사용하세요</p>
  <button id="startBtn">시작하기</button>
</div>

<script>
(function() {
  // ---- Maze layout ----
  // 0 = wall, 1 = dot, 2 = empty, 3 = power pellet, 4 = ghost house door
  const layout = [
    "###################",
    "#........#........#",
    "#o##.###.#.###.##o#",
    "#.................#",
    "#.##.#.#####.#.##.#",
    "#....#...#...#....#",
    "####.### # ###.####",
    "   #.#       #.#   ",
    "####.# ##=##.#.####",
    "    .  #   #  .    ",
    "####.# ##### #.####",
    "   #.#       #.#   ",
    "####.#.#####.#.####",
    "#........#........#",
    "#.##.###.#.###.##.#",
    "#o.#.....P.....#.o#",
    "##.#.#.#####.#.#.##",
    "#....#...#...#....#",
    "#.######.#.######.#",
    "#.................#"
  ];

  const ROWS = layout.length;
  const COLS = layout[0].length;
  let TILE = 18;

  function buildGrid() {
    const grid = [];
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) {
        const ch = (layout[r][c] !== undefined) ? layout[r][c] : '#';
        if (ch === '#') row.push(0);
        else if (ch === '.') row.push(1);
        else if (ch === 'o') row.push(3);
        else if (ch === '=') row.push(4);
        else row.push(2);
      }
      grid.push(row);
    }
    return grid;
  }

  let grid = buildGrid();
  let totalDots = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c] === 1 || grid[r][c] === 3) totalDots++;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const maxW = Math.min(window.innerWidth, 420);
    TILE = Math.floor(maxW / COLS);
    canvas.width = TILE * COLS;
    canvas.height = TILE * ROWS;
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // ---- Helpers ----
  function centerOf(col, row) { return { x: col * TILE + TILE/2, y: row * TILE + TILE/2 }; }

  function wrapCol(c) { return ((c % COLS) + COLS) % COLS; }

  function isWall(col, row) {
    if (row < 0 || row >= ROWS) return true;
    const cc = wrapCol(col);
    return grid[row][cc] === 0;
  }

  const DIRS = {
    up: {x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}, none:{x:0,y:0}
  };
  const OPPOSITE = {up:'down',down:'up',left:'right',right:'left',none:'none'};

  // Check whether an entity currently at (col,row) can start moving in `dir`
  function openDir(col, row, dir) {
    if (!dir || dir === 'none') return false;
    const d = DIRS[dir];
    return !isWall(col + d.x, row + d.y);
  }

  let pac, ghosts, score, lives, running, dotsLeft, frightTimer, gameOverFlag, winFlag;

  function findStart() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (layout[r][c] === 'P') return {col:c, row:r};
    }
    return {col:9,row:15};
  }

  // ---- Entity factory: purely tile-based movement, no free-floating pixel state ----
  function makeEntity(col, row, speedFrac) {
    return {
      col, row,              // tile currently occupied (authoritative)
      dir: 'none',           // current facing/movement direction
      nextDir: 'none',       // queued direction (pac only)
      moving: false,
      progress: 0,           // 0..1 fraction through the move into targetCol/targetRow
      targetColRaw: col,     // may be outside [0,COLS) during tunnel transition
      targetRow: row,
      speedFrac,              // fraction of a tile crossed per frame
    };
  }

  function resetPositions() {
    const st = findStart();
    pac = makeEntity(st.col, st.row, 1/9);
    pac.mouth = 0; pac.mouthDir = 1;

    ghosts = [
      Object.assign(makeEntity(9,9,1/11), {color:'#ff0000', dir:'left', base:{col:9,row:9}, scared:false}),
      Object.assign(makeEntity(8,9,1/11), {color:'#ffb8ff', dir:'up', base:{col:8,row:9}, scared:false}),
      Object.assign(makeEntity(10,9,1/11), {color:'#00ffff', dir:'down', base:{col:10,row:9}, scared:false}),
    ];
    frightTimer = 0;
  }

  function resetGame() {
    grid = buildGrid();
    dotsLeft = totalDots;
    score = 0;
    lives = 3;
    running = false;
    gameOverFlag = false;
    winFlag = false;
    resetPositions();
    updateHud();
  }

  function updateHud() {
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('livesVal').textContent = '●'.repeat(Math.max(lives,0));
  }

  // Try to begin a move for entity e in direction dir. Returns true if started.
  function tryStartMove(e, dir) {
    if (!openDir(e.col, e.row, dir)) return false;
    const d = DIRS[dir];
    e.dir = dir;
    e.targetColRaw = e.col + d.x;
    e.targetRow = e.row + d.y;
    e.moving = true;
    e.progress = 0;
    return true;
  }

  // Advance an in-progress move; finalize (snap to new tile) when done.
  function advanceMove(e) {
    if (!e.moving) return false;
    e.progress += e.speedFrac;
    if (e.progress >= 1) {
      e.progress = 1;
      e.col = wrapCol(e.targetColRaw);
      e.row = e.targetRow;
      e.moving = false;
      return true; // arrived this frame
    }
    return false;
  }

  function getPixelPos(e) {
    const from = centerOf(e.col, e.row);
    if (!e.moving) return from;
    const to = centerOf(e.targetColRaw, e.targetRow);
    return { x: from.x + (to.x - from.x) * e.progress, y: from.y + (to.y - from.y) * e.progress };
  }

  // ---- Pac-Man update ----
  function updatePac() {
    if (!pac.moving) {
      // At rest on a tile center: honor queued turn, else continue, else stop.
      if (pac.nextDir !== pac.dir && tryStartMove(pac, pac.nextDir)) {
        // turned
      } else if (!tryStartMove(pac, pac.dir)) {
        pac.dir = 'none';
      }
    }
    const arrived = advanceMove(pac);
    if (arrived) {
      const cell = grid[pac.row][pac.col];
      if (cell === 1) { grid[pac.row][pac.col] = 2; score += 10; dotsLeft--; }
      else if (cell === 3) { grid[pac.row][pac.col] = 2; score += 50; dotsLeft--; frightTimer = 360; ghosts.forEach(g=>g.scared=true); }
    }
    pac.mouth += 0.2*pac.mouthDir;
    if (pac.mouth > 1 || pac.mouth < 0) pac.mouthDir *= -1;
    updateHud();
    if (dotsLeft <= 0) { winFlag = true; running = false; showOverlay('YOU WIN!', `최종 점수: ${score}`); }
  }

  // ---- Ghost AI ----
  function ghostChooseDir(g) {
    const opts = ['up','down','left','right'].filter(d => openDir(g.col, g.row, d));
    let candidates = opts.filter(d => d !== OPPOSITE[g.dir]);
    if (candidates.length === 0) candidates = opts;
    if (candidates.length === 0) return 'none';

    let target = {col: pac.col, row: pac.row};
    if (g.scared) target = {col: g.base.col, row: g.base.row};

    let best = candidates[0];
    let bestScore = Infinity;
    for (const d of candidates) {
      const dd = DIRS[d];
      const nc = g.col + dd.x, nr = g.row + dd.y;
      const dist = (nc-target.col)*(nc-target.col) + (nr-target.row)*(nr-target.row);
      const s = g.scared ? -dist : dist;
      if (s < bestScore) { bestScore = s; best = d; }
    }
    if (Math.random() < 0.15) best = candidates[Math.floor(Math.random()*candidates.length)];
    return best;
  }

  function updateGhosts() {
    ghosts.forEach(g => {
      if (!g.moving) {
        const dir = ghostChooseDir(g);
        if (!tryStartMove(g, dir)) {
          // truly stuck (shouldn't normally happen); try any open dir
          const opts = ['up','down','left','right'].filter(d => openDir(g.col, g.row, d));
          if (opts.length) tryStartMove(g, opts[0]);
        }
      }
      advanceMove(g);
    });
    if (frightTimer > 0) {
      frightTimer--;
      if (frightTimer === 0) ghosts.forEach(g => g.scared = false);
    }
  }

  function checkCollisions() {
    const pp = getPixelPos(pac);
    for (const g of ghosts) {
      const gp = getPixelPos(g);
      const dx = gp.x - pp.x, dy = gp.y - pp.y;
      if (Math.sqrt(dx*dx+dy*dy) < TILE*0.6) {
        if (g.scared) {
          g.col = g.base.col; g.row = g.base.row;
          g.moving = false; g.progress = 0;
          g.scared = false;
          score += 200;
        } else {
          lives--;
          updateHud();
          if (lives <= 0) {
            running = false;
            gameOverFlag = true;
            showOverlay('GAME OVER', `최종 점수: ${score}`);
          } else {
            resetPositions();
          }
          return;
        }
      }
    }
  }

  // ---- Drawing ----
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = grid[r][c];
        const x = c*TILE, y = r*TILE;
        if (cell === 0) {
          ctx.fillStyle = '#1a1aff';
          ctx.fillRect(x+1, y+1, TILE-2, TILE-2);
        } else if (cell === 1) {
          ctx.fillStyle = '#ffcc99';
          ctx.beginPath();
          ctx.arc(x+TILE/2, y+TILE/2, Math.max(TILE*0.08,1.5), 0, Math.PI*2);
          ctx.fill();
        } else if (cell === 3) {
          ctx.fillStyle = '#ffcc99';
          ctx.beginPath();
          ctx.arc(x+TILE/2, y+TILE/2, TILE*0.25, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }

    const pp = getPixelPos(pac);
    ctx.save();
    ctx.translate(pp.x, pp.y);
    let angle = 0;
    if (pac.dir === 'left') angle = Math.PI;
    else if (pac.dir === 'up') angle = -Math.PI/2;
    else if (pac.dir === 'down') angle = Math.PI/2;
    ctx.rotate(angle);
    const mouthAngle = 0.2 + pac.mouth*0.25;
    ctx.fillStyle = '#ffe000';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0, TILE*0.45, mouthAngle*Math.PI, (2-mouthAngle)*Math.PI);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ghosts.forEach(g => {
      const gp = getPixelPos(g);
      ctx.fillStyle = g.scared ? (frightTimer < 100 && frightTimer%20<10 ? '#ffffff' : '#2222ff') : g.color;
      const gx = gp.x, gy = gp.y, r = TILE*0.45;
      ctx.beginPath();
      ctx.arc(gx, gy - r*0.1, r, Math.PI, 0);
      ctx.lineTo(gx+r, gy+r*0.6);
      for (let i = 0; i < 3; i++) {
        const step = (2*r)/3;
        const bx = gx+r - step*(i+0.5);
        ctx.lineTo(bx, gy + (i%2===0?r*0.6:r*0.9));
      }
      ctx.lineTo(gx-r, gy+r*0.6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(gx-r*0.35, gy-r*0.2, r*0.22, 0, Math.PI*2);
      ctx.arc(gx+r*0.35, gy-r*0.2, r*0.22, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      const ed = DIRS[g.dir] || {x:0,y:0};
      ctx.beginPath();
      ctx.arc(gx-r*0.35+ed.x*r*0.15, gy-r*0.2+ed.y*r*0.15, r*0.1, 0, Math.PI*2);
      ctx.arc(gx+r*0.35+ed.x*r*0.15, gy-r*0.2+ed.y*r*0.15, r*0.1, 0, Math.PI*2);
      ctx.fill();
    });
  }

  // ---- Game loop ----
  function loop() {
    if (running) {
      updatePac();
      updateGhosts();
      checkCollisions();
    }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---- Overlay ----
  const overlay = document.getElementById('msgOverlay');
  const msgTitle = document.getElementById('msgTitle');
  const msgSub = document.getElementById('msgSub');
  const startBtn = document.getElementById('startBtn');

  function showOverlay(title, sub) {
    msgTitle.textContent = title;
    msgSub.textContent = sub;
    startBtn.textContent = '다시 시작';
    overlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', () => {
    overlay.classList.add('hidden');
    resize();
    resetGame();
    running = true;
  });

  // ---- Controls: buttons ----
  function bindHold(id, dir) {
    const el = document.getElementById(id);
    const setDir = (e) => { e.preventDefault(); pac.nextDir = dir; };
    el.addEventListener('touchstart', setDir, {passive:false});
    el.addEventListener('mousedown', setDir);
  }
  bindHold('btnUp','up');
  bindHold('btnDown','down');
  bindHold('btnLeft','left');
  bindHold('btnRight','right');

  // ---- Controls: swipe ----
  let touchStartX=0, touchStartY=0;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, {passive:true});
  canvas.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > 20) pac.nextDir = dx > 0 ? 'right' : 'left';
    } else {
      if (Math.abs(dy) > 20) pac.nextDir = dy > 0 ? 'down' : 'up';
    }
  }, {passive:true});

  // ---- Controls: keyboard (desktop testing) ----
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') pac.nextDir = 'up';
    else if (e.key === 'ArrowDown') pac.nextDir = 'down';
    else if (e.key === 'ArrowLeft') pac.nextDir = 'left';
    else if (e.key === 'ArrowRight') pac.nextDir = 'right';
  });

  resetGame();
  draw();
})();
</script>
</body>
</html>

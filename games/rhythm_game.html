<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>비트 리듬 - Beat Rhythm</title>
<style>
  :root{
    --bg1:#0f0c29;
    --bg2:#302b63;
    --bg3:#24243e;
    --lane-bg: rgba(255,255,255,0.03);
    --lane-border: rgba(255,255,255,0.08);
    --hitline: #ffd166;
    --perfect: #06d6a0;
    --good: #ffd166;
    --miss: #ef476f;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color:#fff;
    overflow:hidden;
    user-select:none;
  }
  #app{
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100%;
    padding:16px;
  }
  h1{
    font-size:20px;
    margin:4px 0 2px 0;
    letter-spacing:2px;
    font-weight:600;
    background: linear-gradient(90deg,#f72585,#7209b7,#4361ee);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  #sub{
    font-size:12px;
    color:rgba(255,255,255,0.5);
    margin-bottom:10px;
  }
  #hud{
    display:flex;
    gap:20px;
    margin-bottom:10px;
    font-size:14px;
    font-variant-numeric: tabular-nums;
  }
  #hud .box{
    background:rgba(255,255,255,0.06);
    padding:6px 14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.1);
    min-width:70px;
    text-align:center;
  }
  #hud .label{ font-size:10px; color:rgba(255,255,255,0.5); display:block;}
  #hud .value{ font-size:16px; font-weight:700; }
  #comboWrap{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    text-align:center;
    z-index:5;
  }
  #comboNum{
    font-size:54px;
    font-weight:800;
    text-shadow:0 0 20px rgba(255,255,255,0.5);
    opacity:0;
    transition:opacity 0.15s;
  }
  #comboLabel{
    font-size:12px;
    letter-spacing:3px;
    color:rgba(255,255,255,0.6);
  }

  #beatPulse{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--hitline);
    margin:0 auto 8px auto;
    box-shadow:0 0 8px var(--hitline);
    transform:scale(1);
    transition: transform 0.08s ease-out, box-shadow 0.08s;
  }

  #gameArea{
    position:relative;
    width:min(420px, 92vw);
    height:min(560px, 62vh);
    background: rgba(0,0,0,0.25);
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
  }
  #lanes{
    display:flex;
    width:100%;
    height:100%;
  }
  .lane{
    flex:1;
    position:relative;
    background:var(--lane-bg);
    border-right:1px solid var(--lane-border);
  }
  .lane:last-child{ border-right:none; }
  .lane.active{
    background: rgba(255,255,255,0.14);
  }

  .hitzone{
    position:absolute;
    bottom:70px;
    left:0; right:0;
    height:6px;
    background: var(--hitline);
    box-shadow:0 0 12px var(--hitline);
    opacity:0.9;
  }
  .keycap{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    width:38px; height:38px;
    border-radius:8px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
    font-size:15px;
    transition: transform 0.08s, background 0.08s;
    color:rgba(255,255,255,0.85);
  }
  .keycap.pressed{
    transform:translateX(-50%) scale(0.85);
    background:rgba(255,255,255,0.35);
  }

  .note{
    position:absolute;
    left:8%;
    width:84%;
    height:16px;
    border-radius:8px;
    background: linear-gradient(180deg,#f72585,#b5179e);
    box-shadow:0 0 10px rgba(247,37,133,0.6);
  }
  .note.lane1{ background:linear-gradient(180deg,#4cc9f0,#4895ef); box-shadow:0 0 10px rgba(76,201,240,0.6);}
  .note.lane2{ background:linear-gradient(180deg,#06d6a0,#1b9aaa); box-shadow:0 0 10px rgba(6,214,160,0.6);}
  .note.lane3{ background:linear-gradient(180deg,#ffd166,#f4a261); box-shadow:0 0 10px rgba(255,209,102,0.6);}

  .judge-pop{
    position:absolute;
    left:50%;
    bottom:90px;
    transform:translateX(-50%);
    font-weight:800;
    font-size:14px;
    pointer-events:none;
    animation: popUp 0.5s ease-out forwards;
    white-space:nowrap;
  }
  @keyframes popUp{
    0%{ opacity:1; transform:translate(-50%,0); }
    100%{ opacity:0; transform:translate(-50%,-30px); }
  }
  .judge-perfect{ color:var(--perfect); text-shadow:0 0 8px var(--perfect); }
  .judge-good{ color:var(--good); text-shadow:0 0 8px var(--good); }
  .judge-miss{ color:var(--miss); text-shadow:0 0 8px var(--miss); }

  #overlay{
    position:absolute;
    inset:0;
    background:rgba(10,8,30,0.88);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    z-index:10;
    border-radius:14px;
  }
  #overlay h2{ margin:0 0 6px 0; font-size:22px; }
  #overlay p{ margin:4px 0; font-size:13px; color:rgba(255,255,255,0.7); line-height:1.6;}
  .btn{
    margin-top:16px;
    padding:10px 26px;
    border-radius:24px;
    border:none;
    background: linear-gradient(90deg,#f72585,#7209b7);
    color:#fff;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(247,37,133,0.4);
  }
  .btn:active{ transform:scale(0.96); }
  #wrapArea{ position:relative; }

  #stats{ display:none; }
  #resultStats span{ font-weight:700; color:#fff; }

  #bpmRow{
    display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; justify-content:center;
  }
  .bpmBtn{
    padding:7px 14px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06);
    color:#fff;
    font-size:12px;
    cursor:pointer;
  }
  .bpmBtn.selected{
    background:rgba(255,255,255,0.3);
    border-color:#fff;
  }
</style>
</head>
<body>
<div id="app">
  <h1>BEAT RHYTHM</h1>
  <div id="sub">자체 생성 배경음악에 맞춰 즐기는 리듬게임</div>

  <div id="hud">
    <div class="box"><span class="label">SCORE</span><span class="value" id="scoreVal">0</span></div>
    <div class="box"><span class="label">COMBO</span><span class="value" id="comboVal">0</span></div>
    <div class="box"><span class="label">MAX</span><span class="value" id="maxComboVal">0</span></div>
  </div>

  <div id="beatPulse"></div>

  <div id="wrapArea">
    <div id="gameArea">
      <div id="lanes">
        <div class="lane" data-lane="0">
          <div class="hitzone"></div>
          <div class="keycap" id="key0">D</div>
        </div>
        <div class="lane" data-lane="1">
          <div class="hitzone"></div>
          <div class="keycap" id="key1">F</div>
        </div>
        <div class="lane" data-lane="2">
          <div class="hitzone"></div>
          <div class="keycap" id="key2">J</div>
        </div>
        <div class="lane" data-lane="3">
          <div class="hitzone"></div>
          <div class="keycap" id="key3">K</div>
        </div>
      </div>
    </div>

    <div id="overlay">
      <h2 id="overlayTitle">시작할 준비 됐나요?</h2>
      <p>게임 안에서 직접 만든 배경음악(신스 드럼+멜로디)이 재생돼요.<br>
      노트가 노란 줄에 닿는 순간 D · F · J · K 키를 누르세요.<br>
      (모바일이면 해당 레인을 탭하세요 · 소리를 켜주세요 🔊)</p>
      <div id="resultStats"></div>
      <div id="bpmRow">
        <button class="bpmBtn" data-bpm="90">느림 90</button>
        <button class="bpmBtn selected" data-bpm="120">보통 120</button>
        <button class="bpmBtn" data-bpm="150">빠름 150</button>
      </div>
      <button class="btn" id="startBtn">게임 시작</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ---------- 오디오 엔진 (Web Audio API로 직접 생성하는 배경음악, 외부 음원 사용 안함) ----------
  let audioCtx = null;
  let masterGain = null;
  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.35;
      masterGain.connect(audioCtx.destination);
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  // 킥/스네어/하이햇 신스 드럼
  function playKick(t){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    gain.gain.setValueAtTime(0.9, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(t); osc.stop(t + 0.2);
  }
  function playHat(t){
    const bufferSize = audioCtx.sampleRate * 0.05;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 7000;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    noise.connect(hp); hp.connect(gain); gain.connect(masterGain);
    noise.start(t); noise.stop(t + 0.05);
  }
  function playSnare(t){
    const bufferSize = audioCtx.sampleRate * 0.15;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1800;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.6, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    noise.connect(bp); bp.connect(gain); gain.connect(masterGain);
    noise.start(t); noise.stop(t + 0.15);
  }
  // 멜로디/베이스용 신스 노트
  function playSynthNote(t, freq, dur, type, vol){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol || 0.25, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  // 판정 시 효과음
  function playHitSound(type){
    if(!audioCtx) return;
    const t = audioCtx.currentTime;
    const freq = type === 'perfect' ? 880 : type === 'good' ? 660 : 220;
    playSynthNote(t, freq, type==='miss' ? 0.12 : 0.08, type==='miss' ? 'sawtooth' : 'sine', type==='miss' ? 0.15 : 0.2);
  }

  // 베이스 라인 (코드 진행 느낌)
  const bassFreqs = [110, 110, 146.83, 130.81]; // A2, A2, D3, C3
  // 멜로디 (펜타토닉 느낌)
  const melodyFreqs = [440, 523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25];
  let melodyIndex = 0;
  let bassIndex = 0;

  function scheduleBeatAudio(beatCount){
    if(!audioCtx) return;
    const t = audioCtx.currentTime + 0.02;
    // 4비트마다 킥/스네어 패턴 (4/4 박자: 킥-하이햇-스네어-하이햇)
    const posInBar = beatCount % 4;
    playHat(t);
    if(posInBar === 0){ playKick(t); playSynthNote(t, bassFreqs[bassIndex % bassFreqs.length], 0.3, 'triangle', 0.18); bassIndex++; }
    if(posInBar === 2){ playSnare(t); playKick(t+0.001); }
    // 절반 확률로 멜로디 추가 (패턴에 맞춰 은은하게)
    if(beatCount % 2 === 0){
      playSynthNote(t, melodyFreqs[melodyIndex % melodyFreqs.length], 0.35, 'triangle', 0.12);
      melodyIndex++;
    }
  }

  const gameArea = document.getElementById('gameArea');
  const lanesEl = document.querySelectorAll('.lane');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const startBtn = document.getElementById('startBtn');
  const scoreVal = document.getElementById('scoreVal');
  const comboVal = document.getElementById('comboVal');
  const maxComboVal = document.getElementById('maxComboVal');
  const beatPulse = document.getElementById('beatPulse');
  const resultStats = document.getElementById('resultStats');
  const bpmBtns = document.querySelectorAll('.bpmBtn');

  const KEYS = ['d','f','j','k'];
  const LANE_COUNT = 4;

  let bpm = 120;
  let beatMs = 60000 / bpm;
  let noteFallMs = 1500; // 노트가 위에서 히트라인까지 내려오는 시간
  let running = false;
  let score = 0, combo = 0, maxCombo = 0;
  let perfectCnt = 0, goodCnt = 0, missCnt = 0;
  let notes = []; // {el, lane, spawnTime, hitTime, judged}
  let rafId = null;
  let beatIntervalId = null;
  let spawnIntervalId = null;
  let startTime = 0;
  let patternIndex = 0;

  // 간단한 패턴 (레인 인덱스 배열, -1은 쉼)
  const pattern = [0,-1,2,3, 1,-1,0,2, 3,-1,1,0, 2,3,-1,1,
                    0,2,-1,3, 1,0,-1,2, 3,1,0,-1, 2,3,1,0];

  bpmBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      bpmBtns.forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      bpm = parseInt(btn.dataset.bpm,10);
    });
  });

  function resetGame(){
    score=0; combo=0; maxCombo=0; perfectCnt=0; goodCnt=0; missCnt=0; patternIndex=0;
    notes.forEach(n=> n.el.remove());
    notes = [];
    updateHud();
  }

  function updateHud(){
    scoreVal.textContent = score;
    comboVal.textContent = combo;
    maxComboVal.textContent = maxCombo;
  }

  function spawnNote(lane){
    const laneEl = lanesEl[lane];
    const note = document.createElement('div');
    note.className = 'note lane'+lane;
    note.style.top = '-20px';
    laneEl.appendChild(note);
    const spawnTime = performance.now();
    const hitTime = spawnTime + noteFallMs;
    notes.push({el:note, lane, spawnTime, hitTime, judged:false});
  }

  function gameLoop(now){
    if(!running) return;
    const areaHeight = gameArea.clientHeight;
    const hitZoneY = areaHeight - 70; // hitzone bottom offset
    notes.forEach(n=>{
      if(n.judged) return;
      const progress = (now - n.spawnTime) / noteFallMs; // 0..1
      const y = progress * hitZoneY - 8;
      n.el.style.top = y + 'px';
      if(now > n.hitTime + 180 && !n.judged){
        judge(n, 'miss');
      }
    });
    // 오래된 노트 정리
    notes = notes.filter(n=>{
      if(n.judged && n.markedRemove){
        n.el.remove();
        return false;
      }
      return true;
    });
    rafId = requestAnimationFrame(gameLoop);
  }

  let beatCounter = 0;
  function pulseBeat(){
    beatPulse.style.transform = 'scale(1.9)';
    beatPulse.style.boxShadow = '0 0 20px var(--hitline)';
    setTimeout(()=>{
      beatPulse.style.transform = 'scale(1)';
      beatPulse.style.boxShadow = '0 0 8px var(--hitline)';
    }, 90);
    scheduleBeatAudio(beatCounter);
    beatCounter++;
  }

  function scheduleNotes(){
    // 매 비트마다 패턴에 따라 노트 생성 + 배경음악 재생 (노트가 히트라인까지 오는데 걸리는 시간만큼 미리 스폰)
    beatIntervalId = setInterval(()=>{
      pulseBeat();
    }, beatMs);

    // 노트는 half-beat 단위 패턴, 미리 spawn 되도록 지연 적용
    spawnIntervalId = setInterval(()=>{
      const lane = pattern[patternIndex % pattern.length];
      patternIndex++;
      if(lane >= 0){
        spawnNote(lane);
      }
    }, beatMs/2);
  }

  function judge(note, forcedType){
    if(note.judged) return;
    note.judged = true;
    let type = forcedType;
    if(!forcedType){
      const diff = Math.abs(performance.now() - note.hitTime);
      if(diff <= 80) type = 'perfect';
      else if(diff <= 180) type = 'good';
      else type = 'miss';
    }
    applyJudgeResult(note, type);
  }

  function applyJudgeResult(note, type){
    const laneEl = lanesEl[note.lane];
    const pop = document.createElement('div');
    pop.className = 'judge-pop judge-' + type;
    pop.textContent = type === 'perfect' ? 'PERFECT' : type === 'good' ? 'GOOD' : 'MISS';
    laneEl.appendChild(pop);
    setTimeout(()=> pop.remove(), 500);

    if(type === 'perfect'){
      score += 100 + combo*2;
      combo++; perfectCnt++;
    } else if(type === 'good'){
      score += 50 + combo;
      combo++; goodCnt++;
    } else {
      combo = 0; missCnt++;
    }
    maxCombo = Math.max(maxCombo, combo);
    note.el.style.opacity = '0';
    note.markedRemove = true;
    playHitSound(type);
    updateHud();
  }

  function findClosestNote(lane){
    let best = null, bestDiff = Infinity;
    const now = performance.now();
    notes.forEach(n=>{
      if(n.judged || n.lane !== lane) return;
      const diff = Math.abs(now - n.hitTime);
      if(diff < bestDiff){
        bestDiff = diff;
        best = n;
      }
    });
    if(best && bestDiff <= 220){
      judge(best);
    }
    // hit 실패(노트 없음)여도 콤보는 유지, 페널티 없음 - 관대한 판정
  }

  function flashLane(lane){
    lanesEl[lane].classList.add('active');
    setTimeout(()=> lanesEl[lane].classList.remove('active'), 100);
    const key = document.getElementById('key'+lane);
    key.classList.add('pressed');
    setTimeout(()=> key.classList.remove('pressed'), 100);
  }

  function handleLaneInput(lane){
    if(!running) return;
    flashLane(lane);
    findClosestNote(lane);
  }

  document.addEventListener('keydown', (e)=>{
    const idx = KEYS.indexOf(e.key.toLowerCase());
    if(idx !== -1){
      handleLaneInput(idx);
    }
  });

  lanesEl.forEach((laneEl, idx)=>{
    laneEl.addEventListener('touchstart', (e)=>{ e.preventDefault(); handleLaneInput(idx); }, {passive:false});
    laneEl.addEventListener('mousedown', ()=> handleLaneInput(idx));
  });

  function startGame(){
    ensureAudio();
    resetGame();
    beatCounter = 0; melodyIndex = 0; bassIndex = 0;
    beatMs = 60000 / bpm;
    noteFallMs = Math.max(1100, beatMs * 4);
    overlay.style.display = 'none';
    running = true;
    startTime = performance.now();
    rafId = requestAnimationFrame(gameLoop);
    scheduleNotes();

    // 60초 후 자동 종료
    setTimeout(()=>{ if(running) endGame(); }, 60000);
  }

  function endGame(){
    running = false;
    cancelAnimationFrame(rafId);
    clearInterval(beatIntervalId);
    clearInterval(spawnIntervalId);
    overlayTitle.textContent = '결과';
    const total = perfectCnt + goodCnt + missCnt;
    const acc = total > 0 ? Math.round(((perfectCnt + goodCnt*0.5) / total) * 100) : 0;
    resultStats.innerHTML =
      '<p>점수: <span>'+score+'</span></p>' +
      '<p>최대 콤보: <span>'+maxCombo+'</span></p>' +
      '<p>PERFECT <span>'+perfectCnt+'</span> · GOOD <span>'+goodCnt+'</span> · MISS <span>'+missCnt+'</span></p>' +
      '<p>정확도: <span>'+acc+'%</span></p>';
    startBtn.textContent = '다시 하기';
    overlay.style.display = 'flex';
  }

  startBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
